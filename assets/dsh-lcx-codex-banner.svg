<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">DSH-LCX-CODEX</title>
  <desc id="desc">Native Responses capabilities for DeepSeek Harness: Hosted Search, Alpha Search and Native V2 Compaction.</desc>
  <defs>
