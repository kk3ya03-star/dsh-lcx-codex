source:
  repository: kk3ya03-star/dsh-lcx-codex-private
  engineering_issues: [117, 119, 121]
  product_commit: b489af86c25bdf93fb15559e9804db3ef9f002d4
  product_tree: 4c8b5979af75fc5c8a7ea85d8bc8902ad72471da
