    - .github/workflows/verify.yml
    - .github/workflows/finalize-stable-release.yml
    - README.md
    - README_EN.md
    - CHANGELOG.md
    - ARCHITECTURE.md
    - CONTRIBUTING.md
    - assets/settings-card.png
