verification:
  state: READY_FOR_FINAL_CONFIRMATION
  policy: Parity against the private release source, the full engineering gate set on the exact public tree, the package boundary and the isolated install smoke are recorded in the Release Readiness Report. Real DSH 0.2.1-alpha.2 runtime evidence is recorded in the Worker-session comments of Issues #117, #119, #120 and #122 (isolated home; the #120 live A/B ran on build 6b0e61f, the #122 PTC and Plugin Manager card checks on 8fb3615, the #117/#119 sessions on earlier builds of the same line); the DSH 0.2.1-alpha.2 retarget itself was runtime-QA'd for 0.5.1-pre.1 (docs/qa/issue-115/RUNTIME-QA.md). No public tag, npm publication, dist-tag change or GitHub Release has occurred.
runtime_basis:
  dsh: 0.2.1-alpha.2
  host_pi: 1.1.0
  plugin_pi: 0.87.1
  qualification: ENGINEERING_PASS with real-runtime evidence for the exact baseline plugin 0.6.0-pre.1 x DSH 0.2.1-alpha.2 x host Pi 1.1.0 x plugin Pi 0.87.1. Not VERIFIED; publication does not by itself promote this assessment.
  install_range: ">=0.2.1-alpha.2 (lower bound only, no ceiling; Product Owner decision 2026-10-10). Newer DSH versions can install but are unverified."
  remaining: Technical Lead review of Issues #120 and #122 and of release readiness, Product Owner final irreversible confirmation and post-publication verification remain. Not exercisable live and covered by real-class tests only - in-stream failure classification, the aggregate request image bound, the incomplete tool group, hosted usage edge cases and the SSE stall cancel. Not covered by runtime QA - natural pressure-band Native V2 trigger and Alpha search.
publication:
  state: APPROVED_PENDING_PUBLISH
  policy: Product Owner approval is recorded for building this prerelease, but the final irreversible Product Owner confirmation is still REQUIRED_BEFORE_PUBLIC_TAG. Until it is recorded, the public tag, merge of the public PR, npm prelatest publication and GitHub prerelease are blocked even though this record is in the publishable state shape. Publication, once confirmed, moves prelatest from 0.5.1-pre.1 to 0.6.0-pre.1 and leaves stable latest unchanged. Order - stable 0.5.1 (private main / public stable/0.5.x) is published first, so stable_latest_must_remain is 0.5.1; if stable 0.5.1 is not published first this value must be changed back to 0.5.0 before publication (the publish workflow asserts that npm latest equals it).
previous_release:
  version: 0.5.0
  tag: v0.5.0
  policy: Existing stable artifact, public tag and registry version are immutable and must not be reused. Stable 0.5.1 (stable/0.5.x line, Issue #121) is published before this prerelease and then is the npm latest that must not move (stable_latest_must_remain); it is not part of this tree.
previous_prerelease:
  version: 0.5.1-pre.1
  tag: v0.5.1-pre.1
  policy: Existing published artifact, public tag and registry version are immutable and must not be reused; superseded on prelatest only after the confirmed 0.6.0-pre.1 publication. The never-published 0.5.1-pre.2 is superseded by 0.6.0-pre.1 and its tag and version are not used.
