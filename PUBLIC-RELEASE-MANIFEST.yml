    - qa/**
    - releases/**
    - compatibility/**
    - tools/**
    - .github/**
verification:
  state: READY_FOR_FINAL_CONFIRMATION
  policy: Zero-functional-change parity against the frozen 0.5.0-pre.1 source, the full engineering gate set on the exact public tree and the package boundary are recorded in the Release Readiness Report. No public tag, npm publication, dist-tag change or GitHub Release has occurred.
runtime_basis:
  dsh: 0.2.0-rc.2
  host_pi: 0.87.1
  plugin_pi: 0.87.1
  qualification: Inherited unchanged from the post-release VERIFIED exact baseline of 0.5.0-pre.1 (plugin x DSH 0.2.0-rc.2 x host Pi 0.87.1 x plugin Pi 0.87.1). Stable publication does not widen the claim to other DSH builds in the install range.
  remaining: Only the Product Owner final irreversible confirmation and post-publication verification remain. Issue #62 remains an upstream typed-provenance seam and #105 an upstream CSS-cleanup tracker; neither is a release blocker.
publication:
  state: APPROVED_PENDING_PUBLISH
  policy: Release approval is recorded, but the final irreversible Product Owner confirmation is still REQUIRED_BEFORE_PUBLIC_TAG. Until it is recorded, the public tag, npm latest publication and GitHub Release are blocked even though this record is in the publishable state shape. Publication, once confirmed, moves latest from 0.4.3 to 0.5.0 and leaves prelatest on 0.5.0-pre.1.
previous_release:
  version: 0.5.0-pre.1
  tag: v0.5.0-pre.1
  policy: Existing published artifact, public tag and registry version are immutable and must not be reused.
previous_stable:
  version: 0.4.3
  tag: v0.4.3
  policy: Existing stable artifact; remains the npm latest until the confirmed 0.5.0 publication.
