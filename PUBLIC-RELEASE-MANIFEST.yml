verification:
  state: READY_FOR_FINAL_CONFIRMATION
  policy: Parity against the private release source, the full engineering gate set on the exact public tree, the package boundary and the tarball identity are recorded in the Release Readiness Report. Real DSH 0.2.1-alpha.2 runtime evidence for the Issue #123 fix, the Technical Lead review follow-ups, the bundled Pi 1.1.0, the audit cleanup and the remaining plugin-side items is recorded in the Issue #123 Worker-session comments (6109224424 on build 4cf1d5f, 6110048211 on d2f917e, 6110372654 on bbfed46, 6111110429 on 3d55b61, 6112535019 on 5345d81, 6126784483 on the product commit e97ab74) and docs/qa/issue-127/RUNTIME-QA.md (isolated home, lib byte-identical installs); the DSH 0.2.1-alpha.2 retarget itself was runtime-QA'd for 0.5.1-pre.1 (docs/qa/issue-115/RUNTIME-QA.md) and the 0.6.0-pre.1 features on the same baseline. No public tag, npm publication, dist-tag change or GitHub Release has occurred for 0.6.0-pre.2.
runtime_basis:
  dsh: 0.2.1-alpha.2
  host_pi: 1.1.0
  plugin_pi: 1.1.0
  qualification: ENGINEERING_PASS with real-runtime evidence for the exact baseline plugin 0.6.0-pre.2 x DSH 0.2.1-alpha.2 x host Pi 1.1.0 x plugin Pi 1.1.0. Not VERIFIED; publication does not by itself promote this assessment.
  install_range: ">=0.2.1-alpha.2 (lower bound only, no ceiling; Product Owner decision 2026-10-10). Newer DSH versions can install but are unverified."
  remaining: Product Owner final irreversible confirmation, publication after stable 0.5.2 is on npm latest, and post-publication verification remain. Not exercisable live and covered by real-class tests only - in-stream failure classification, the aggregate request image bound, the incomplete tool group, hosted usage edge cases and the SSE stall cancel. Not covered by runtime QA - natural pressure-band Native V2 trigger and Alpha search. A model whose protocol is unknown to DSH, the profile and the bundled Pi 1.1.0 catalog fails closed by design.
publication:
  state: APPROVED_PENDING_PUBLISH
  policy: Product Owner approval is recorded for building this prerelease, but the final irreversible Product Owner confirmation is still REQUIRED_BEFORE_PUBLIC_TAG. Until it is recorded, the public tag, merge of the public PR, npm prelatest publication and GitHub prerelease are blocked even though this record is in the publishable state shape. Publication, once confirmed, moves prelatest from 0.6.0-pre.1 to 0.6.0-pre.2 and leaves stable latest unchanged. Order - stable 0.5.2 (private main / public stable/0.5.x, Issue #126) is published first, so stable_latest_must_remain is 0.5.2; this value is not yet true on the registry (latest is 0.5.1 until 0.5.2 is published) and the publish workflow asserts that npm latest equals it, so publishing this prerelease before 0.5.2 fails closed.
previous_release:
  version: 0.5.1
  tag: v0.5.1
  policy: Existing stable artifact, public tag and registry version are immutable and must not be reused. Stable 0.5.2 (stable/0.5.x line, Issue #126) is published before this prerelease and then is the npm latest that must not move (stable_latest_must_remain); it is not part of this tree.
previous_prerelease:
  version: 0.6.0-pre.1
  tag: v0.6.0-pre.1
  policy: Existing published artifact, public tag and registry version are immutable and must not be reused; superseded on prelatest only after the confirmed 0.6.0-pre.2 publication.
