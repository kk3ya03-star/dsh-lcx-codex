  frozen_tag: frozen/v0.5.2
  frozen_tag_state: NOT_CREATED_UNTIL_FINAL_CONFIRMATION
  policy: Product/runtime source is the private engineering commit above (the Issue 123 route-resolution fix on the 0.5.1 line, runtime-identical to the QA build). Later commits on the release-control branch change only governance records, evidence documents and the manifest. The frozen/v0.5.2 tag is created only after the Product Owner final confirmation.
public_target:
  repository: kk3ya03-star/dsh-lcx-codex
  branch: stable/0.5.x
  tag: v0.5.2
  qualification: Stable line branch. The pre line (0.6.x, DSH 0.2.1 and later) lives on public main; the stable 0.5.x line (DSH 0.2.0) lives on stable/0.5.x, created from the published tag v0.5.0. The tag is created on the merge commit into stable/0.5.x.
  npm_dist_tag: latest
  previous_latest_must_be: 0.5.1
  prerelease_channel_retained: prelatest stays 0.6.0-pre.1 until its own release; 0.5.1 and 0.6.0-pre.1 are immutable and must not be reused or moved.
public_export:
  from_private_release_source:
    - .gitattributes
    - .gitignore
    - src/**
    - lib/**
    - tests/**
    - scripts/**
    - package.json
    - package-lock.json
    - tsconfig.json
    - tsconfig.client.json
    - cordis.patch.yml
    - LICENSE
    - THIRD_PARTY_NOTICES.md
  from_release_control_overlay:
    - PUBLIC-RELEASE-MANIFEST.yml
  public_test_support_from_private_release_source:
    - data/model-scope-086-matrix.json
    - data/pi086-responses-descriptors.json
    - data/pi086-responses-models.json
    - data/step0c-route-086.json
    - qa/issue-62/adapter-off.mjs
  public_test_support_policy: Deterministic fixtures and one reversible QA helper referenced by the public tests, exported byte-identical from the private release source. They are never npm payload (package.json files remains the runtime allowlist). The single qa/issue-62/adapter-off.mjs allowlist overrides the general qa/** exclusion for that file only; no other qa/** path is exported.
  preserve_or_update_on_public_surface:
    - .github/workflows/publish.yml
    - .github/workflows/verify.yml
    - .github/workflows/finalize-stable-release.yml
    - README.md
    - README_EN.md
    - CHANGELOG.md
    - ARCHITECTURE.md
    - CONTRIBUTING.md
    - assets/settings-card.png
  distribution_overlays_reviewed:
    - README.md (public zh; DSH 0.2.0-rc.2 installs 0.5.2 via @latest, DSH 0.2.1 and later installs the prerelease via @prelatest, DSH 0.1.5 pins 0.4.3, DSH 0.1.6 keeps its pinned-prerelease guidance)
    - README_EN.md (same install-matrix change)
    - CHANGELOG.md (0.5.2 stable section; no private issue numbers)
    - ARCHITECTURE.md (stable version wording only, if it names the version)
    - assets/settings-card.png (recaptured from an isolated install of the exact public 0.5.2 tarball on DSH 0.2.0-rc.2; badge v0.5.2)
    - .github/ISSUE_TEMPLATE/bug.yml (version placeholder)
    - .github/workflows (unchanged from the published v0.5.0 line; runtime fixture runtime-dsh02)
  public_readme_policy: Update the reviewed public README and README_EN install matrix for the stable line; do not export the private control-plane README.
  exclude_from_private_export:
    - README.md
    - AGENTS.md
    - AI-MANIFEST.yml
    - GOVERNANCE.md
    - PROJECT-CHARTER.md
    - STATUS.md
    - ROADMAP.md
    - ERRORS.md
    - RESEARCH.md
    - DESIGN.md
    - DEVELOPMENT-PLAN.md
    - ACCEPTANCE.md
    - docs/**
    - qa/**
    - releases/**
    - compatibility/**
    - tools/**
    - .github/**
verification:
  state: READY_FOR_FINAL_CONFIRMATION
  policy: Parity against the private release source, the full engineering gate set on the exact public tree and the package boundary are recorded in the Release Readiness Report. Real-runtime QA of the fix on DSH 0.2.0-rc.2 passed on the QA build (Issue 123 runtime QA record, docs/qa/issue-126/RUNTIME-QA.md). No public tag, npm publication, dist-tag change or GitHub Release has occurred.
runtime_basis:
  dsh: 0.2.0-rc.2
  host_pi: 0.87.1
  plugin_pi: 0.87.1
  qualification: ENGINEERING_PASS with real-runtime QA evidence for the exact baseline plugin 0.5.2 x DSH 0.2.0-rc.2 x host Pi 0.87.1 x plugin Pi 0.87.1. Not VERIFIED until the stable artifact is published and post-release verified; publication alone does not promote the assessment. Stable publication does not widen the claim to other DSH builds in the install range.
  remaining: Only the Technical Lead review, the Product Owner final irreversible confirmation and post-publication verification remain. Issue #62 remains an upstream typed-provenance seam and #105 an upstream CSS-cleanup tracker; neither is a release blocker.
publication:
  state: APPROVED_PENDING_PUBLISH
  policy: Release approval is recorded, but the final irreversible Product Owner confirmation is still REQUIRED_BEFORE_PUBLIC_TAG. Until it is recorded, the public tag, npm latest publication and GitHub Release are blocked even though this record is in the publishable state shape. Publication, once confirmed, moves latest from 0.5.1 to 0.5.2 and leaves prelatest on 0.6.0-pre.1. This stable release must be published before 0.6.0-pre.2.
previous_release:
  version: 0.5.1
  tag: v0.5.1
  policy: Existing stable artifact, public tag and registry version are immutable and must not be reused; remains the npm latest until the confirmed 0.5.2 publication.
previous_prerelease:
  version: 0.6.0-pre.1
  tag: v0.6.0-pre.1
  policy: Existing published prerelease on the pre line; immutable and must not be reused or moved. prelatest stays on it.
