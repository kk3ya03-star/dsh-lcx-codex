verification:
  state: ENGINEERING_RUNTIME_QA_AND_PUBLIC_EXPORT_PASSED_RELEASE_APPROVED
  release_tarball: dsh-lcx-codex-0.6.0.tgz, 42 files, SHA-256 a6bedda05b12959bbbb1d0dc34cceeb6875930ff01fae0f39263aeac01fe5110 (npm pack --ignore-scripts of the exact public export tree; the release manifest is not npm payload)
  record_paths: The docs/qa/** and releases/** paths cited in this manifest are internal audit records in the private source repository (source.repository); they are not published and are not accessible publicly.
  policy: Static impact review of DSH 0.2.1-rc.2 -> 0.2.1-rc.5 and Pi 1.3.0 -> 1.5.0 (docs/qa/issue-129/REBASELINE-2026-11-03.md; the earlier docs/qa/issue-129/COMPATIBILITY-REVIEW.md is superseded for this line) and the full engineering gate set on the exact DSH 0.2.1-rc.5 runtime (host Pi 1.5.0 = plugin Pi 1.5.0). Real DSH runtime QA (required for an L3 change) is complete on exact DSH 0.2.1-rc.5 (docs/qa/issue-129/RUNTIME-QA-STABLE.md; commits d913800 and 397dce8; both stop conditions not hit; plugin suite 750/750 on 397dce8). The Technical Lead accepted the engineering and runtime QA evidence on 2026-11-04 (product commit 397dce8; exact DSH 0.2.1-rc.5, host and plugin Pi 1.5.0 only; ENGINEERING_PASS, not VERIFIED). Public export (Technical Lead Revision 2 PASS 2026-11-04, plus the README wording note) - parity 0 violations, the 102 runtime files (src, lib, cordis.patch.yml) and every other exported file blob-identical to the private source (only scripts/extract-cache-baseline.mjs differs from the QA'd 397dce8, not npm payload), 41 of 42 packed files byte-identical to the QA'd 397dce8 tarball (only README.md, now the public README), gates rerun on the exact export tree. The Product Owner approved the release on 2026-11-04 (approval.approval_reference).
runtime_basis:
  dsh: 0.2.1-rc.5
  host_pi: 1.5.0
  plugin_pi: 1.5.0
  qualification: ENGINEERING_PASS for the exact baseline only (plugin 0.6.0 x DSH 0.2.1-rc.5 x host Pi 1.5.0 x plugin Pi 1.5.0) - contract and engineering gates pass on the exact DSH 0.2.1-rc.5 runtime, real DSH runtime QA is complete (docs/qa/issue-129/RUNTIME-QA-STABLE.md) and the Technical Lead accepted both on 2026-11-04 (product commit 397dce8). Not VERIFIED; no claim for later DSH versions. Publication approved by the Product Owner on 2026-11-04 (APPROVED_PENDING_PUBLISH). A fresh DSH install resolves host Pi 1.5.0 (DSH ships no shrinkwrap); a changed resolved host Pi is itself a reassessment trigger, and link fails closed when the host Pi differs from the bundled Pi.
  install_range: ">=0.2.1-rc.5 <0.2.2-0 (Product Owner re-baseline 2026-11-03; a bounded stable ceiling must end in <X.Y.Z-0 because DSH compares with includePrerelease, so <0.2.2 would admit 0.2.2-alpha.*). Admits DSH 0.2.1-rc.5 and later DSH 0.2.1 builds; the verified claim, once earned, is the exact DSH 0.2.1-rc.5 baseline only."
  remaining: "Only the public steps and post-release verification remain - the public PR into stable/0.6.x, merge, tag v0.6.0, npm publication through the public workflow, the manually created GitHub Release, then post-release verification (registry package, install, SHA-256, version display, latest/prelatest). Stable 0.6.0 is published first; 0.7.0-pre.1 follows the same day. Coverage boundaries accepted by the Product Owner with the release approval (not PASS, not blockers; stated in the public README, CHANGELOG and ARCHITECTURE) - model-switch compaction from GPT to a non-GPT model; a GPT to GPT switch that needs a summary; an actual GPT to Grok turn under a Grok profile whose maxTokens equals contextWindow; the gpt-5.6-sol first turn, the gpt-5.4 / gpt-5.5 mode-none models and gpt-6-sol effort switching without separate full runtime evidence; xai/grok-4.7 without a gateway channel (grok-4.6 suffices); native X Search not separately re-verified in this release. Open non-blockers from the runtime QA record - DSH session-log-deepseek upload carrying GPT opaque state (outside LCX scope, not pursued by Product Owner decision 2026-11-04), log noise for tool-less one-shot requests, the unreachable later-system-message residual. The earlier pre-approval checklist (export review, tarball, release order and layout, ranges and known limits, approval) is complete; its history is in the Git log of this file."
