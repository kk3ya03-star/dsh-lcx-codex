name: Bug report
description: Report an issue with dsh-lcx-codex on DeepSeek Harness
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, Authorization headers, credentials, encrypted provider state, or complete unredacted session logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly explain what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin, DSH, and Node.js versions
      placeholder: "dsh-lcx-codex 0.7.0 | @deepseek-ai/dsh 0.2.2-rc.5 | Node v24.x"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model / provider profile shape (redacted)
      placeholder: "e.g. openai / gpt-6.2-sol, xai / grok-4.6, Responses gateway without secrets"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Clear steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error or log snippet
      description: Remove URLs with tokens, credentials, and private paths.
