name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Require an approved prerelease tag and preserve stable channel
        id: release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, appendFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = readFileSync('PUBLIC-RELEASE-MANIFEST.yml', 'utf8');
          const field = name => manifest.match(new RegExp(`^\\s*${name}:\\s*(\\S+)\\s*$`, 'm'))?.[1];
          assert.equal(pkg.name, 'dsh-lcx-codex');
          assert.match(pkg.version, /^\d+\.\d+\.\d+-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*$/, 'This workflow only publishes prereleases');
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`);
          assert.equal(field('version'), pkg.version);
          assert.equal(field('tag'), `v${pkg.version}`);
          assert.equal(field('npm_dist_tag'), 'prelatest');
          assert(['APPROVED_PRERELEASE', 'RELEASED_PRERELEASE'].includes(field('state')));
          const tagsResponse = await fetch('https://registry.npmjs.org/-/package/dsh-lcx-codex/dist-tags');
          assert(tagsResponse.ok, `Registry tags HTTP ${tagsResponse.status}`);
          const tags = await tagsResponse.json();
          assert.equal(tags.latest, field('stable_latest_must_remain'));
          const existing = await fetch(`https://registry.npmjs.org/dsh-lcx-codex/${pkg.version}`);
          assert(existing.ok || existing.status === 404, `Registry version HTTP ${existing.status}`);
          if (existing.ok) assert.equal((await existing.json()).version, pkg.version);
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${existing.ok}\n`);
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${pkg.version}\nSTABLE_VERSION=${tags.latest}\n`);
          console.log(existing.ok ? 'Version already published: skip npm publish without changing dist-tags.' : 'Approved new prerelease; publish only to prelatest.');
          NODE
      - name: Install locked build and host dependencies
        if: steps.release.outputs.exists == 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/runtime-dsh015 --ignore-scripts --no-audit --no-fund
          node scripts/link-dsh-runtime.mjs scripts/runtime-dsh015
      - name: Verify exact generated source and package
        if: steps.release.outputs.exists == 'false'
        run: |
          node scripts/check-generated.mjs
          npm run typecheck
          npm test
          npm run test:schema
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.exists == 'false'
        with:
          name: verified-public-package
          path: ${{ runner.temp }}/dsh-lcx-codex-${{ env.RELEASE_VERSION }}.tgz
          if-no-files-found: error
      - name: Publish verified artifact with provenance
        if: steps.release.outputs.exists == 'false'
        run: |
          npm install --global npm@latest
          npm publish "$RUNNER_TEMP/dsh-lcx-codex-$RELEASE_VERSION.tgz" --provenance --tag prelatest --ignore-scripts
      - name: Verify stable tag remains unchanged
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://registry.npmjs.org/-/package/dsh-lcx-codex/dist-tags');
          assert(response.ok);
          const tags = await response.json();
          assert.equal(tags.latest, process.env.STABLE_VERSION);
          console.log(JSON.stringify(tags));
          NODE
