name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'kk3ya03-star/dsh-lcx-codex'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Enforce release policy and registry preconditions
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          DIST_TAGS_JSON="$(npm view dsh-lcx-codex dist-tags --json --registry=https://registry.npmjs.org)"
          export DIST_TAGS_JSON
          node --input-type=module - <<'EOF'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { assertReleasePolicy } from './scripts/release-policy.mjs'
          import { compareSemver, parseStrictSemver } from './scripts/semver-range.mjs'

          const pkg = JSON.parse(readFileSync('./package.json', 'utf8'))
          const manifest = readFileSync('./PUBLIC-RELEASE-MANIFEST.yml', 'utf8')
          const ctx = assertReleasePolicy(pkg, manifest, process.env.GITHUB_REF)

          assert.match(ctx.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/u)
          assert.match(ctx.branch, /^(?:main|stable\/\d+\.\d+\.x)$/u)
          assert.match(ctx.distTag, /^(?:latest|prelatest|stable-\d+\.\d+)$/u)
          if (ctx.previousLatestMustBe !== undefined) {
            assert.match(ctx.previousLatestMustBe, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u)
          }
          if (ctx.stableLatestMustRemain !== undefined) {
            assert.match(ctx.stableLatestMustRemain, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u)
          }

          const targetSha = execFileSync('git', ['rev-list', '-n', '1', process.env.GITHUB_REF], { encoding: 'utf8' }).trim()
          execFileSync('git', ['fetch', '--force', 'origin', `+refs/heads/${ctx.branch}:refs/remotes/origin/${ctx.branch}`], { stdio: 'inherit' })
          try {
            execFileSync('git', ['merge-base', '--is-ancestor', targetSha, `refs/remotes/origin/${ctx.branch}`], { stdio: 'inherit' })
          } catch {
            throw new Error(`Release tag ${process.env.GITHUB_REF} (${targetSha}) is not an ancestor of origin/${ctx.branch}.`)
          }

          const res = await fetch(`https://registry.npmjs.org/dsh-lcx-codex/${encodeURIComponent(ctx.version)}`)
          if (res.status !== 200 && res.status !== 404) {
            throw new Error(`Registry lookup for dsh-lcx-codex@${ctx.version} failed with HTTP ${res.status}`)
          }
          const alreadyExists = res.status === 200
          if (alreadyExists) {
            const remoteDoc = await res.json()
            assert.ok(typeof remoteDoc?.dist?.shasum === 'string' && remoteDoc.dist.shasum.length > 0, 'Existing npm version missing dist.shasum')
            assert.ok(typeof remoteDoc?.dist?.integrity === 'string' && remoteDoc.dist.integrity.length > 0, 'Existing npm version missing dist.integrity')
          }

          const tags = JSON.parse(process.env.DIST_TAGS_JSON ?? '{}')
          assert.ok(tags && typeof tags === 'object' && Object.prototype.hasOwnProperty.call(tags, 'latest') && typeof tags.latest === 'string', 'Missing npm dist-tags.latest')
          const currentLatest = tags.latest
          const currentChannelVer = Object.prototype.hasOwnProperty.call(tags, ctx.distTag) && typeof tags[ctx.distTag] === 'string' && tags[ctx.distTag].length > 0
            ? tags[ctx.distTag]
            : undefined

          if (ctx.distTag === 'latest') {
            if (!alreadyExists) {
              assert.equal(currentLatest, ctx.previousLatestMustBe, `Expected current npm latest to be ${ctx.previousLatestMustBe}, got ${currentLatest}.`)
            } else {
              assert.ok(
                currentLatest === ctx.previousLatestMustBe || currentLatest === ctx.version,
                `Expected current npm latest to be ${ctx.previousLatestMustBe} or ${ctx.version} on rerun, got ${currentLatest}.`,
              )
            }
          } else {
            assert.equal(currentLatest, ctx.stableLatestMustRemain, `Expected npm latest to remain ${ctx.stableLatestMustRemain}, got ${currentLatest}.`)
            if (currentChannelVer !== undefined && (!alreadyExists || currentChannelVer !== ctx.version)) {
              const currentParsed = parseStrictSemver(currentChannelVer, `dist-tags.${ctx.distTag}`)
              const candidateParsed = parseStrictSemver(ctx.version, 'version')
              assert.ok(
                compareSemver(candidateParsed, currentParsed) > 0,
                `Refusing dist-tag downgrade: ${ctx.distTag} is already at ${currentChannelVer} (candidate ${ctx.version}).`,
              )
            }
          }

          const outputs = [
            `version=${ctx.version}`,
            `branch=${ctx.branch}`,
            `dist_tag=${ctx.distTag}`,
            `previous_latest=${ctx.previousLatestMustBe ?? ''}`,
            `stable_latest_remain=${ctx.stableLatestMustRemain ?? ''}`,
            `already_published=${alreadyExists ? 'true' : 'false'}`,
          ].join('\n') + '\n'
          if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, outputs, 'utf8')
          if (process.env.GITHUB_ENV) {
            appendFileSync(
              process.env.GITHUB_ENV,
              [
                `LCX_POLICY_VERSION=${ctx.version}`,
                `LCX_POLICY_BRANCH=${ctx.branch}`,
                `LCX_POLICY_DIST_TAG=${ctx.distTag}`,
                `LCX_POLICY_PREVIOUS_LATEST=${ctx.previousLatestMustBe ?? ''}`,
                `LCX_POLICY_STABLE_REMAIN=${ctx.stableLatestMustRemain ?? ''}`,
              ].join('\n') + '\n',
              'utf8',
            )
          }
          EOF
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install --global npm@11.21.3
      - name: Install locked build and host dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/runtime-dsh022 --ignore-scripts --no-audit --no-fund
          node scripts/link-dsh-runtime.mjs
      - name: Verify generated code, strict types, tests, schemas and curated tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/release-policy.test.mjs scripts/link-dsh-runtime.test.mjs scripts/finalize-workflow.test.mjs scripts/publish-workflow.test.mjs scripts/pack-local.test.mjs
          node scripts/check-generated.mjs
          npm run typecheck
          LCX_EXPECT_PUBLIC_CHECKOUT=1 npm test
          npm run test:schema
          git diff --exit-code
          TARBALL="$(npm run pack:local --silent -- --public --pack-destination "$RUNNER_TEMP")"
          if [[ -z "$TARBALL" || "$TARBALL" == */* || "$TARBALL" == *\\* || ! -f "$RUNNER_TEMP/$TARBALL" ]]; then
            echo "Curated tarball was not emitted at $RUNNER_TEMP/$TARBALL" >&2
            exit 1
          fi
          TARBALL_PATH="$RUNNER_TEMP/$TARBALL" node --input-type=module - <<'EOF'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readFileSync } from 'node:fs'

          const tarPath = process.env.TARBALL_PATH
          const buf = readFileSync(tarPath)
          const sha256 = createHash('sha256').update(buf).digest('hex')
          const shasum = createHash('sha1').update(buf).digest('hex')
          const integrity = `sha512-${createHash('sha512').update(buf).digest('base64')}`
          process.stdout.write(`Verified tarball ${tarPath}\n  sha256: ${sha256}\n  shasum: ${shasum}\n  integrity: ${integrity}\n`)
          if (process.env.GITHUB_OUTPUT) {
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              [
                `tarball=${tarPath}`,
                `tarball_sha256=${sha256}`,
                `tarball_shasum=${shasum}`,
                `tarball_integrity=${integrity}`,
              ].join('\n') + '\n',
              'utf8',
            )
          }
          EOF
      - name: Upload verified public package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-public-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.tarball }}
          retention-days: 30
      - name: Re-verify registry preconditions immediately before npm publish
        id: publish_precheck
        env:
          LCX_VERSION: ${{ steps.policy.outputs.version }}
          LCX_DIST_TAG: ${{ steps.policy.outputs.dist_tag }}
          LCX_PREVIOUS_LATEST: ${{ steps.policy.outputs.previous_latest }}
          LCX_STABLE_REMAIN: ${{ steps.policy.outputs.stable_latest_remain }}
          LCX_TARBALL_SHASUM: ${{ steps.package.outputs.tarball_shasum }}
          LCX_TARBALL_INTEGRITY: ${{ steps.package.outputs.tarball_integrity }}
        shell: bash
        run: |
          set -euo pipefail
          DIST_TAGS_JSON="$(npm view dsh-lcx-codex dist-tags --json --registry=https://registry.npmjs.org)"
          export DIST_TAGS_JSON
          node --input-type=module - <<'EOF'
          import assert from 'node:assert/strict'
          import { appendFileSync } from 'node:fs'
          import { compareSemver, parseStrictSemver } from './scripts/semver-range.mjs'

          const version = process.env.LCX_VERSION ?? ''
          const distTag = process.env.LCX_DIST_TAG ?? ''
          const previousLatest = process.env.LCX_PREVIOUS_LATEST ?? ''
          const stableRemain = process.env.LCX_STABLE_REMAIN ?? ''
          const localShasum = process.env.LCX_TARBALL_SHASUM ?? ''
          const localIntegrity = process.env.LCX_TARBALL_INTEGRITY ?? ''

          const res = await fetch(`https://registry.npmjs.org/dsh-lcx-codex/${encodeURIComponent(version)}`)
          if (res.status !== 200 && res.status !== 404) {
            throw new Error(`Pre-publish registry lookup for dsh-lcx-codex@${version} failed with HTTP ${res.status}`)
          }

          const tags = JSON.parse(process.env.DIST_TAGS_JSON ?? '{}')
          assert.ok(tags && typeof tags === 'object' && Object.prototype.hasOwnProperty.call(tags, 'latest') && typeof tags.latest === 'string', 'Missing npm dist-tags.latest')
          const currentLatest = tags.latest
          const currentTagVer = Object.prototype.hasOwnProperty.call(tags, distTag) && typeof tags[distTag] === 'string' && tags[distTag].length > 0
            ? tags[distTag]
            : undefined

          let shouldPublish = false
          let shouldDistTag = false

          if (res.status === 404) {
            if (distTag === 'latest') {
              assert.equal(currentLatest, previousLatest, `Pre-publish latest drifted from ${previousLatest} to ${currentLatest}.`)
            } else {
              assert.equal(currentLatest, stableRemain, `Pre-publish latest drifted from ${stableRemain} to ${currentLatest}.`)
              if (currentTagVer !== undefined) {
                assert.ok(
                  compareSemver(parseStrictSemver(version, 'version'), parseStrictSemver(currentTagVer, `dist-tags.${distTag}`)) > 0,
                  `Refusing pre-publish dist-tag downgrade: ${distTag} is already at ${currentTagVer}.`,
                )
              }
            }
            shouldPublish = true
          } else {
            const remoteDoc = await res.json()
            assert.equal(remoteDoc?.dist?.shasum, localShasum, `Published npm shasum (${remoteDoc?.dist?.shasum}) mismatches verified local tarball (${localShasum}).`)
            assert.equal(remoteDoc?.dist?.integrity, localIntegrity, `Published npm integrity (${remoteDoc?.dist?.integrity}) mismatches verified local tarball (${localIntegrity}).`)
            if (currentTagVer !== version) {
              if (distTag === 'latest') {
                assert.equal(currentLatest, previousLatest, `Expected npm latest ${previousLatest} before converging dist-tag, got ${currentLatest}.`)
              } else {
                assert.equal(currentLatest, stableRemain, `Expected npm latest to remain ${stableRemain}, got ${currentLatest}.`)
                if (currentTagVer !== undefined) {
                  assert.ok(
                    compareSemver(parseStrictSemver(version, 'version'), parseStrictSemver(currentTagVer, `dist-tags.${distTag}`)) > 0,
                    `Refusing rerun dist-tag downgrade: ${distTag} is already at ${currentTagVer}.`,
                  )
                }
              }
              shouldDistTag = true
            }
          }

          if (process.env.GITHUB_OUTPUT) {
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `should_publish=${shouldPublish ? 'true' : 'false'}\nshould_dist_tag=${shouldDistTag ? 'true' : 'false'}\n`,
              'utf8',
            )
          }
          EOF
      - name: Publish curated tarball to npm with provenance
        if: steps.publish_precheck.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "${{ steps.policy.outputs.dist_tag }}" "${{ steps.package.outputs.tarball }}"
      - name: Converge npm dist-tag for verified existing publication
        if: steps.publish_precheck.outputs.should_dist_tag == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add "dsh-lcx-codex@${{ steps.policy.outputs.version }}" "${{ steps.policy.outputs.dist_tag }}" --registry=https://registry.npmjs.org
      - name: Verify npm publication and channel convergence
        env:
          LCX_VERSION: ${{ steps.policy.outputs.version }}
          LCX_DIST_TAG: ${{ steps.policy.outputs.dist_tag }}
          LCX_STABLE_REMAIN: ${{ steps.policy.outputs.stable_latest_remain }}
          LCX_TARBALL_SHASUM: ${{ steps.package.outputs.tarball_shasum }}
          LCX_TARBALL_INTEGRITY: ${{ steps.package.outputs.tarball_integrity }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_ATTEMPTS="${LCX_CONVERGE_ATTEMPTS:-30}"
          SLEEP_SEC="${LCX_CONVERGE_SLEEP_SEC:-5}"
          converged=false
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            DIST_TAGS_JSON="$(npm view dsh-lcx-codex dist-tags --json --registry=https://registry.npmjs.org 2>/dev/null || true)"
            export DIST_TAGS_JSON
            status=0
            node --input-type=module - <<'EOF' || status=$?
            import assert from 'node:assert/strict'

            const version = process.env.LCX_VERSION ?? ''
            const distTag = process.env.LCX_DIST_TAG ?? ''
            const stableRemain = process.env.LCX_STABLE_REMAIN ?? ''
            const localShasum = process.env.LCX_TARBALL_SHASUM ?? ''
            const localIntegrity = process.env.LCX_TARBALL_INTEGRITY ?? ''

            const res = await fetch(`https://registry.npmjs.org/dsh-lcx-codex/${encodeURIComponent(version)}`)
            if (res.status !== 200 && res.status !== 404) {
              console.error(`Registry verification for dsh-lcx-codex@${version} failed with HTTP ${res.status}`)
              process.exit(2)
            }
            if (res.status === 404) process.exit(10)

            const remoteDoc = await res.json()
            assert.equal(remoteDoc?.dist?.shasum, localShasum, `Published npm shasum (${remoteDoc?.dist?.shasum}) mismatches verified local tarball (${localShasum}).`)
            assert.equal(remoteDoc?.dist?.integrity, localIntegrity, `Published npm integrity (${remoteDoc?.dist?.integrity}) mismatches verified local tarball (${localIntegrity}).`)

            const tagsRaw = (process.env.DIST_TAGS_JSON ?? '').trim()
            if (!tagsRaw) process.exit(10)
            const tags = JSON.parse(tagsRaw)
            const tagVer = tags && typeof tags === 'object' && Object.prototype.hasOwnProperty.call(tags, distTag) && typeof tags[distTag] === 'string' ? tags[distTag] : undefined
            if (tagVer !== version) process.exit(10)

            if (distTag !== 'latest') {
              const latestVer = tags && typeof tags === 'object' && Object.prototype.hasOwnProperty.call(tags, 'latest') && typeof tags.latest === 'string' ? tags.latest : undefined
              assert.equal(latestVer, stableRemain, `npm latest unexpectedly moved from ${stableRemain} to ${latestVer}.`)
            }
          EOF
            if [[ "$status" -eq 0 ]]; then
              converged=true
              break
            elif [[ "$status" -ne 10 ]]; then
              exit "$status"
            fi
            if [[ "$attempt" -lt "$MAX_ATTEMPTS" && "$SLEEP_SEC" != "0" ]]; then
              sleep "$SLEEP_SEC"
            fi
          done
          if [[ "$converged" != true ]]; then
            echo "npm publication dsh-lcx-codex@${LCX_VERSION} on dist-tag ${LCX_DIST_TAG} did not converge." >&2
            exit 1
          fi
