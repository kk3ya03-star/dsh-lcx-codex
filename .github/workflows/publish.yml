name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Require an approved release tag and registry precondition
        id: release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, appendFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = readFileSync('PUBLIC-RELEASE-MANIFEST.yml', 'utf8');
          const { assertReleasePolicy } = await import('./scripts/release-policy.mjs');
          const field = assertReleasePolicy(pkg, manifest, process.env.GITHUB_REF);
          const prerelease = pkg.version.includes('-');
          const distTag = prerelease ? 'prelatest' : 'latest';
          const tagsResponse = await fetch('https://registry.npmjs.org/-/package/dsh-lcx-codex/dist-tags', {cache:'no-store'});
          assert(tagsResponse.ok, `Registry tags HTTP ${tagsResponse.status}`);
          const tags = await tagsResponse.json();
          if (prerelease) assert.equal(tags.latest, field('stable_latest_must_remain'));
          else assert.equal(tags.latest, field('previous_latest_must_be'));
          const existing = await fetch(`https://registry.npmjs.org/dsh-lcx-codex/${pkg.version}`, {cache:'no-store'});
          assert(existing.ok || existing.status === 404, `Registry version HTTP ${existing.status}`);
          if (existing.ok) assert.equal((await existing.json()).version, pkg.version);
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${existing.ok}\n`);
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${pkg.version}\nRELEASE_DIST_TAG=${distTag}\nPREVIOUS_LATEST=${tags.latest}\n`);
          console.log(existing.ok ? 'Version already exists; verify channel without republishing.' : `Approved new release; publish to ${distTag}.`);
          NODE
      - name: Install locked build and host dependencies
        if: steps.release.outputs.exists == 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/runtime-dsh015 --ignore-scripts --no-audit --no-fund
          node scripts/link-dsh-runtime.mjs
      - name: Verify exact generated source and package
        if: steps.release.outputs.exists == 'false'
        run: |
          node --test scripts/release-policy.test.mjs scripts/link-dsh-runtime.test.mjs
          node scripts/check-generated.mjs
          npm run typecheck
          npm test
          npm run test:schema
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.exists == 'false'
        with:
          name: verified-public-package
          path: ${{ runner.temp }}/dsh-lcx-codex-${{ env.RELEASE_VERSION }}.tgz
          if-no-files-found: error
      - name: Publish verified artifact with provenance
        if: steps.release.outputs.exists == 'false'
        run: |
          npm install --global npm@11.17.0
          npm publish "$RUNNER_TEMP/dsh-lcx-codex-$RELEASE_VERSION.tgz" --provenance --tag "$RELEASE_DIST_TAG" --ignore-scripts
      - name: Verify registry channel
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const prerelease = process.env.RELEASE_VERSION.includes('-');
          let last;
          for (let attempt = 0; attempt < 20; attempt++) {
            const response = await fetch('https://registry.npmjs.org/-/package/dsh-lcx-codex/dist-tags', {cache:'no-store'});
            assert(response.ok);
            last = await response.json();
            const ok = prerelease
              ? last.latest === process.env.PREVIOUS_LATEST && last.prelatest === process.env.RELEASE_VERSION
              : last.latest === process.env.RELEASE_VERSION;
            if (ok) { console.log(JSON.stringify(last)); process.exit(0); }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          console.error(JSON.stringify(last));
          throw new Error('Registry dist-tag did not converge to the approved channel');
          NODE
