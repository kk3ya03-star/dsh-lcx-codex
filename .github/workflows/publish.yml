name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mark() {
            local context="$1" state="$2" description="$3"
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"npm/${context}\",\"description\":\"${description}\"}" >/dev/null || true
          }

          mark install pending "installing dependencies"
          if ! npm install --ignore-scripts --no-audit --no-fund; then
            mark install failure "npm install failed"
            exit 1
          fi
          mark install success "dependencies installed"

          mark tests pending "running tests"
          if ! npm test; then
            mark tests failure "npm test failed"
            exit 1
          fi
          if ! npm run test:schema; then
            mark tests failure "schema validation failed"
            exit 1
          fi
          mark tests success "tests and schemas passed"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
              mark publish failure "tag does not match package version"
              exit 1
            fi
          fi

          mark registry pending "checking npm registry"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            mark registry success "version already exists on npm"
            mark published success "npm version verified"
            exit 0
          fi
          mark registry success "version not present; publishing"

          mark publish pending "publishing with trusted publishing"
          if ! npm install --global npm@latest; then
            mark publish failure "npm CLI upgrade failed"
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            if ! npm publish --provenance --tag next; then
              mark publish failure "npm publish failed"
              exit 1
            fi
          else
            if ! npm publish --provenance --tag latest; then
              mark publish failure "npm publish failed"
              exit 1
            fi
          fi
          mark publish success "npm publish completed"
          mark published success "npm version published"
