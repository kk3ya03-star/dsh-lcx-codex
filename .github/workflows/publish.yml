name: Publish to npm

on:
  push:
    tags: ['v*']
    branches: ['release-trigger/0.4.3-pre.3']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.4.3-pre.3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Require approved prerelease tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a11f63fb836797985737784d6687ba17aaa3ea4e
          test "$(node -p "require('./package.json').version")" = 0.4.3-pre.3
          test "$(git rev-list -n1 v0.4.3-pre.3)" = a11f63fb836797985737784d6687ba17aaa3ea4e
      - name: Install locked build and host dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/runtime-alpha2 --ignore-scripts --no-audit --no-fund
          node scripts/link-dsh-runtime.mjs scripts/runtime-alpha2
      - name: Verify exact generated source and package
        run: |
          node scripts/check-generated.mjs
          npm run typecheck
          npm test
          npm run test:schema
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-public-package
          path: ${{ runner.temp }}/dsh-lcx-codex-0.4.3-pre.3.tgz
          if-no-files-found: error
      - name: Publish verified artifact with provenance
        run: |
          npm install --global npm@latest
          npm publish "$RUNNER_TEMP/dsh-lcx-codex-0.4.3-pre.3.tgz" --provenance --tag prelatest --ignore-scripts
      - name: Remove one-time release trigger branch
        if: success()
        run: git push origin --delete release-trigger/0.4.3-pre.3 || true
