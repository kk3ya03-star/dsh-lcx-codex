name: Verify 0.4.3-pre.3 release tree

on:
  push:
    branches: ['release/0.4.3-pre.3']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release metadata
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = 0.4.3-pre.3
          node -e "const p=require('./package.json'); if(p.peerDependencies['@deepseek-ai/dsh-tool-web']!=='0.1.3-alpha.2') process.exit(1)"
          grep -q 'refs/tags/v0.4.3-pre.3' .github/workflows/publish.yml
          grep -q '^version: 0.4.3-pre.3$' PUBLIC-RELEASE-MANIFEST.yml
          test ! -e .github/workflows/materialize-pre3.yml
      - name: Install locked build and host dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/runtime-alpha2 --ignore-scripts --no-audit --no-fund
          node scripts/link-dsh-runtime.mjs scripts/runtime-alpha2
      - name: Verify generated output, types, tests, schemas and package
        run: |
          node scripts/check-generated.mjs
          npm run typecheck
          npm test
          npm run test:schema
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/dsh-lcx-codex-0.4.3-pre.3.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pre3-package
          path: ${{ runner.temp }}/dsh-lcx-codex-0.4.3-pre.3.tgz
          if-no-files-found: error
