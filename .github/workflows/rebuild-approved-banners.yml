name: Rebuild approved banner artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-approved-banners.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct approved artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path('assets')
          specs = {
              'zh': ('dsh-lcx-codex-banner.png', 'README.md', 'assets/dsh-lcx-codex-banner.svg', 'assets/dsh-lcx-codex-banner.png'),
              'en': ('dsh-lcx-codex-banner-en.png', 'README_EN.md', 'assets/dsh-lcx-codex-banner-en.svg', 'assets/dsh-lcx-codex-banner-en.png'),
          }

          for lang, (output, readme, old_ref, new_ref) in specs.items():
              parts = [Image.open(assets / f'dsh-lcx-codex-banner-{lang}-{i}.webp').convert('RGB') for i in range(1, 7)]
              width = sum(im.width for im in parts)
              height = max(im.height for im in parts)
              canvas = Image.new('RGB', (width, height), 'white')
              x = 0
              for im in parts:
                  canvas.paste(im, (x, 0))
                  x += im.width
              canvas.save(assets / output, format='PNG', optimize=True)

              p = Path(readme)
              text = p.read_text(encoding='utf-8')
              if old_ref not in text:
                  raise SystemExit(f'expected banner reference missing in {readme}: {old_ref}')
              p.write_text(text.replace(old_ref, new_ref, 1), encoding='utf-8')

          for lang in ('zh', 'en'):
              for i in range(1, 7):
                  (assets / f'dsh-lcx-codex-banner-{lang}-{i}.webp').unlink()

          for stale in ('dsh-lcx-codex-banner.svg', 'dsh-lcx-codex-banner-en.svg'):
              p = assets / stale
              if p.exists():
                  p.unlink()

          Path('.github/workflows/rebuild-approved-banners.yml').unlink()
          PY
      - name: Commit final banner assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: use approved generated banner artwork'
          git push
