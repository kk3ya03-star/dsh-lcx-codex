name: Finalize stable GitHub Release

on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to finalize (e.g. v0.7.0)"
        required: true
        type: string
      workflow_run_id:
        description: "Optional Publish to npm workflow run ID for manual recovery"
        required: false
        type: string
      workflow_run_attempt:
        description: "Optional Publish to npm run attempt for manual recovery (requires workflow_run_id)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.repository == 'kk3ya03-star/dsh-lcx-codex' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      applicable: ${{ steps.resolve.outputs.applicable }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve canonical release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin --tags '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/stable/*:refs/remotes/origin/stable/*'

          TAG=""
          APPLICABLE="true"
          if [[ "${EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            RAW_TAG="${DISPATCH_TAG:-}"
            if [[ "$RAW_TAG" == refs/tags/* ]]; then
              echo "workflow_dispatch requires bare tag vX.Y.Z without refs/tags/ prefix, got '${RAW_TAG}'." >&2
              exit 1
            fi
            TAG="$RAW_TAG"
            if [[ -z "$TAG" || "$TAG" == *-* || ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "workflow_dispatch requires a valid stable tag (vX.Y.Z), got '${RAW_TAG}'." >&2
              exit 1
            fi
          elif [[ -n "${WORKFLOW_RUN_SHA:-}" ]]; then
            CANDIDATE_TAG="${WORKFLOW_RUN_BRANCH:-}"
            CANDIDATE_TAG="${CANDIDATE_TAG#refs/tags/}"
            if [[ -n "$CANDIDATE_TAG" ]] && git rev-parse -q --verify "refs/tags/$CANDIDATE_TAG" >/dev/null 2>&1; then
              CANDIDATE_TARGET="$(git rev-list -n 1 "refs/tags/$CANDIDATE_TAG")"
              if [[ "$CANDIDATE_TARGET" == "$WORKFLOW_RUN_SHA" ]]; then
                TAG="$CANDIDATE_TAG"
              fi
            fi
            if [[ -z "$TAG" ]]; then
              STABLE_TAGS=()
              while IFS= read -r tagged; do
                [[ -z "$tagged" ]] && continue
                if [[ "$tagged" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && "$tagged" != *-* ]]; then
                  STABLE_TAGS+=("$tagged")
                fi
              done < <(git tag --points-at "$WORKFLOW_RUN_SHA")
              if [[ "${#STABLE_TAGS[@]}" -eq 0 ]]; then
                echo "No stable tag at workflow_run head_sha $WORKFLOW_RUN_SHA; stable finalizer is inert."
                APPLICABLE="false"
                TAG="inert"
              elif [[ "${#STABLE_TAGS[@]}" -gt 1 ]]; then
                echo "Multiple stable tags point at $WORKFLOW_RUN_SHA: ${STABLE_TAGS[*]}; use workflow_dispatch with explicit tag." >&2
                exit 1
              else
                TAG="${STABLE_TAGS[0]}"
              fi
            fi
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "No release tag context available for stable finalizer." >&2
            exit 1
          fi

          if [[ "$APPLICABLE" == "true" && ( "$TAG" == *-* || ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ) ]]; then
            echo "Non-stable tag $TAG; stable finalizer is inert."
            APPLICABLE="false"
            TAG="inert"
          fi

          if [[ "$APPLICABLE" == "true" ]]; then
            if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Resolved applicable release tag is invalid: '$TAG'." >&2
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag refs/tags/$TAG does not exist." >&2
              exit 1
            fi
          else
            TAG="inert"
          fi

          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            {
              echo "applicable=$APPLICABLE"
              echo "tag=$TAG"
            } >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${GITHUB_ENV:-}" ]]; then
            {
              echo "LCX_FINALIZE_APPLICABLE=$APPLICABLE"
              echo "LCX_FINALIZE_TAG=$TAG"
            } >> "$GITHUB_ENV"
          fi

  finalize:
    needs: resolve
    if: >-
      github.repository == 'kk3ya03-star/dsh-lcx-codex' &&
      needs.resolve.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: finalize-stable-${{ github.repository }}-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate tagged package, full release policy, and target branch ancestry
        id: policy
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin --tags '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/stable/*:refs/remotes/origin/stable/*'

          TAG="${TAG:-${LCX_FINALIZE_TAG:-}}"
          if [[ -z "$TAG" || "$TAG" == *-* || ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid canonical stable tag '${TAG}'." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag refs/tags/$TAG does not exist." >&2
            exit 1
          fi

          TARGET="$(git rev-list -n 1 "refs/tags/$TAG")"
          if [[ "${EVENT_NAME:-}" == "workflow_run" && -n "${WORKFLOW_RUN_SHA:-}" && "$TARGET" != "$WORKFLOW_RUN_SHA" ]]; then
            echo "Tag $TAG resolves to $TARGET, which does not match workflow_run head_sha $WORKFLOW_RUN_SHA." >&2
            exit 1
          fi

          if ! git cat-file -e "${TARGET}:PUBLIC-RELEASE-MANIFEST.yml" 2>/dev/null; then
            echo "Tagged commit $TARGET for $TAG is missing required PUBLIC-RELEASE-MANIFEST.yml." >&2
            exit 1
          fi
          export TAG TARGET

          node --input-type=module - <<'EOF'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'

          const tag = process.env.TAG ?? ''
          const targetSha = process.env.TARGET ?? ''
          const pkg = JSON.parse(execFileSync('git', ['show', `${targetSha}:package.json`], { encoding: 'utf8' }))
          const manifestText = execFileSync('git', ['show', `${targetSha}:PUBLIC-RELEASE-MANIFEST.yml`], { encoding: 'utf8' })

          const STRICT_SEMVER_RE =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/u
          const COMPARATOR_TOKEN_RE = /^(>=|<=|>|<|=)?([^\s]+)$/u

          function parseStrictSemver(value, label) {
            assert.equal(typeof value, 'string', `${label} must be a string`)
            const match = STRICT_SEMVER_RE.exec(value)
            assert.ok(match, `${label} "${value}" is not valid strict SemVer`)
            return {
              raw: value,
              major: BigInt(match[1]),
              minor: BigInt(match[2]),
              patch: BigInt(match[3]),
              prerelease: match[4] === undefined ? [] : match[4].split('.'),
              build: match[5] === undefined ? [] : match[5].split('.'),
            }
          }

          function compareIdentifiers(left, right) {
            const leftNum = /^\d+$/u.test(left) ? BigInt(left) : undefined
            const rightNum = /^\d+$/u.test(right) ? BigInt(right) : undefined
            if (leftNum !== undefined && rightNum !== undefined) {
              return leftNum === rightNum ? 0 : leftNum < rightNum ? -1 : 1
            }
            if (leftNum !== undefined) return -1
            if (rightNum !== undefined) return 1
            return left === right ? 0 : left < right ? -1 : 1
          }

          function compareSemver(left, right) {
            for (const field of ['major', 'minor', 'patch']) {
              if (left[field] !== right[field]) return left[field] < right[field] ? -1 : 1
            }
            if (left.prerelease.length === 0 || right.prerelease.length === 0) {
              if (left.prerelease.length === right.prerelease.length) return 0
              return left.prerelease.length === 0 ? 1 : -1
            }
            const length = Math.max(left.prerelease.length, right.prerelease.length)
            for (let i = 0; i < length; i += 1) {
              if (left.prerelease[i] === undefined) return -1
              if (right.prerelease[i] === undefined) return 1
              const cmp = compareIdentifiers(left.prerelease[i], right.prerelease[i])
              if (cmp !== 0) return cmp
            }
            return 0
          }

          function isExclusivePrereleaseZeroCeiling(c) {
            return c.operator === '<' && c.semver.prerelease.length === 1 && c.semver.prerelease[0] === '0' && c.semver.build.length === 0
          }

          function isExpectedReleaseCeiling(semverObj, verifiedObj) {
            return (
              semverObj.major === verifiedObj.major &&
              semverObj.minor === verifiedObj.minor &&
              semverObj.patch === verifiedObj.patch + 1n &&
              semverObj.prerelease.length === 1 &&
              semverObj.prerelease[0] === '0' &&
              semverObj.build.length === 0
            )
          }

          function assertStableBoundedRange(range, label, verifiedDsh) {
            assert.equal(typeof range, 'string', `${label} must be a string`)
            const trimmed = range.trim()
            assert.ok(trimmed.length > 0, `${label} must be non-empty`)
            assert.doesNotMatch(trimmed, /\|\|/u, `${label} must be a single comparator set without ||`)
            assert.doesNotMatch(trimmed, /[,*^~]/u, `${label} cannot use *, ^, ~, or comma ranges`)
            assert.doesNotMatch(trimmed, /\s-\s/u, `${label} cannot use hyphen ranges`)
            const comparators = trimmed.split(/\s+/u).map((token) => {
              const m = COMPARATOR_TOKEN_RE.exec(token)
              assert.ok(m, `${label} has unsupported comparator "${token}"`)
              const operator = m[1] ?? '='
              const verStr = m[2]
              assert.ok(!verStr.includes('+') && !/^[><=]/.test(verStr), `${label} comparator "${token}" is malformed`)
              const semver = parseStrictSemver(verStr, `${label} comparator`)
              assert.equal(semver.build.length, 0, `${label} comparator "${token}" cannot contain build metadata`)
              return { raw: token, operator, semver }
            })
            for (const c of comparators) {
              if (c.operator === '<' || c.operator === '<=') {
                assert.ok(isExclusivePrereleaseZeroCeiling(c), `${label} upper bound must use <X.Y.Z-0`)
              }
            }
            const exacts = comparators.filter((c) => c.operator === '=')
            const lowers = comparators.filter((c) => c.operator === '>=' || c.operator === '>')
            const uppers = comparators.filter((c) => c.operator === '<' || c.operator === '<=')
            assert.equal(exacts.length, 0, `${label} must use bounded >= ... <X.Y.Z-0 range`)
            assert.ok(lowers.length > 0, `${label} must include an approved lower bound`)
            assert.ok(uppers.length > 0 && uppers.every((c) => isExclusivePrereleaseZeroCeiling(c)), `${label} must include a bounded <X.Y.Z-0 ceiling`)
            const verified = parseStrictSemver(verifiedDsh, 'verifiedDsh')
            for (const item of comparators) {
              const cmp = compareSemver(verified, item.semver)
              const ok = item.operator === '>=' ? cmp >= 0 : item.operator === '<=' ? cmp <= 0 : item.operator === '>' ? cmp > 0 : item.operator === '<' ? cmp < 0 : cmp === 0
              assert.ok(ok, `${label} "${range}" must satisfy verified DSH ${verifiedDsh}`)
            }
            for (const lower of lowers) {
              assert.ok(compareSemver(lower.semver, verified) >= 0, `${label} lower bound ${lower.raw} drops below verified DSH ${verifiedDsh}`)
            }
            for (const upper of uppers) {
              assert.ok(isExpectedReleaseCeiling(upper.semver, verified), `${label} upper bound ${upper.raw} must match <${verified.major}.${verified.minor}.${verified.patch + 1n}-0`)
            }
          }

          const CONTROL_TOP_KEYS = new Set(['version', 'state'])
          const CONTROL_SECTIONS = new Set(['approval', 'verification', 'public_target', 'runtime_basis', 'publication'])
          const YAML_NULL_OR_BOOL_RE = /^(?:null|Null|NULL|~|true|True|TRUE|false|False|FALSE|yes|Yes|YES|no|No|NO|on|On|ON|off|Off|OFF)$/u
          const UNSUPPORTED_PREFIX_RE = /^[|>{}[\]*&!@`%?]/u
          const UNSUPPORTED_TOKENS_RE = /[{}[\]]/u
          const DISALLOWED_INVISIBLE_RE = /[\ufeff\p{Cf}]/u
          const ISSUE_NUMBER_RE = /^[1-9]\d{0,8}$/u
          const WORK_BRANCH_REF_RE = /^(?:work\/[1-9]\d{0,8}-[A-Za-z0-9][A-Za-z0-9._-]*|main|stable\/\d+\.\d+\.x)$/u
          const COMMIT_LIST_SEP_SRC = '(?:[ \\t]*,[ \\t]*(?:and\\b[ \\t]*)?|[ \\t]*(?:&|\\/|\\band\\b)[ \\t]*|[ \\t]+)'
          const COMMIT_LABEL_RE =
            /^(?:(?:product|verified|reviewed|tl[\s_-]*reviewed|candidate|release|source|target)[\s_-]+)*commits?\b(?:(?:\s*[:=]\s*|\s+)(?:shas?|hashes|ids|refs|are|were|is|at|was|equals))*(?:\s*[:=]\s*|\s+)/iu
          const COMMIT_LIST_SEP_START_RE = new RegExp(`^${COMMIT_LIST_SEP_SRC}`, 'iu')
          const COMMIT_SCAN_RE = new RegExp(
            `(?:\\b(?:product|verified|reviewed|tl[\\s_-]*reviewed|candidate|release|source|target)[\\s_-]+)*\\bcommits?\\b(?:(?:\\s*[:=]\\s*|\\s+)(?:shas?|hashes|ids|refs|are|were|is|at|was|equals))*(?:\\s*[:=]\\s*|\\s+)([0-9a-f]{7,40}(?:${COMMIT_LIST_SEP_SRC}[0-9a-f]{7,40})*)\\b`,
            'giu',
          )
          const ACTIVE_COMMIT_LIST_LEFT_RE = new RegExp(
            `^(?:(?:product|verified|reviewed|tl[\\s_-]*reviewed|candidate|release|source|target)[\\s_-]+)*commits?\\b(?:(?:\\s*[:=]\\s*|\\s+)(?:shas?|hashes|ids|refs|are|were|is|at|was|equals))*(?:\\s*[:=]\\s*|\\s+)[0-9a-f]{7,40}(?:${COMMIT_LIST_SEP_SRC}[0-9a-f]{7,40})*$`,
            'iu',
          )
          const UPSTREAM_LEAD_SRC = '(?:upstream|dsh|pi(?:-ai)?|openai|xai)\\s+(?:issue[-\\s#]*\\d+|#\\d+)'
          const UPSTREAM_TAIL_ITEM_SRC = '(?:(?:upstream|dsh|pi(?:-ai)?|openai|xai)\\s+)?(?:issue[-\\s#]*\\d+|#\\d+)'
          const UPSTREAM_LIST_SEP_SRC = '(?:[ \\t]*,[ \\t]*(?:and\\b[ \\t]*)?|[ \\t]*(?:&|\\/|\\band\\b)[ \\t]*)'
          const ACTIVE_UPSTREAM_LIST_LEFT_RE = new RegExp(
            `^${UPSTREAM_LEAD_SRC}(?:${UPSTREAM_LIST_SEP_SRC}${UPSTREAM_TAIL_ITEM_SRC})*$`,
            'iu',
          )
          const ACTIVE_UPSTREAM_LIST_RIGHT_RE = new RegExp(`^[ \\t]*(?:and\\b[ \\t]*)?${UPSTREAM_TAIL_ITEM_SRC}\\b`, 'iu')
          const sanitizeValidatedQaClauseForDenylist = (clause) =>
            clause.replace(/\(([^)]*)\)/gu, (_m, inner) => {
              const sanitizedItems = inner
                .split(';')
                .map((item) => (/^\s*both\s+stop\s+conditions\s+not\s+hit\s*$/iu.test(item) ? ' ' : item))
                .join(';')
              return `(${sanitizedItems})`
            })
          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&')

          function parseAndVerifyCommitExpression(rawText, verifyShaFn) {
            const s = rawText.replace(/[*_~`"'‘’“”«»]+/gu, ' ').replace(/[ \t]+/gu, ' ').trim()
            const headMatch = COMMIT_LABEL_RE.exec(s)
            if (!headMatch) return false
            let rest = s.slice(headMatch[0].length)
            const firstMatch = /^([0-9a-f]{7,40})(?![0-9a-zA-Z_-])/iu.exec(rest)
            if (!firstMatch) return false
            verifyShaFn(firstMatch[1])
            rest = rest.slice(firstMatch[1].length)
            while (rest.length > 0) {
              const sepMatch = COMMIT_LIST_SEP_START_RE.exec(rest)
              if (!sepMatch) return false
              rest = rest.slice(sepMatch[0].length)
              const nextMatch = /^([0-9a-f]{7,40})(?![0-9a-zA-Z_-])/iu.exec(rest)
              if (!nextMatch) return false
              verifyShaFn(nextMatch[1])
              rest = rest.slice(nextMatch[1].length)
            }
            return true
          }

          function splitTopLevelVerificationClauses(policyText) {
            let depth = 0
            for (let i = 0; i < policyText.length; i += 1) {
              const c = policyText[i]
              if (c === '(') {
                depth += 1
                if (depth > 1) assert.fail('verification.policy must not contain nested parentheses')
              } else if (c === ')') {
                depth -= 1
                if (depth < 0) assert.fail('verification.policy contains unbalanced parentheses')
              }
            }
            assert.equal(depth, 0, 'verification.policy contains unclosed parentheses')

            const clauses = []
            let start = 0
            let parenDepth = 0
            const flush = (endIdx) => {
              const chunk = policyText.slice(start, endIdx).trim().replace(/^(?:and|plus)\s+/iu, '').replace(/\s+/gu, ' ')
              if (chunk.length > 0) clauses.push(chunk)
            }
            for (let i = 0; i < policyText.length; i += 1) {
              const ch = policyText[i]
              if (ch === '(') {
                parenDepth += 1
                continue
              }
              if (ch === ')') {
                parenDepth -= 1
                continue
              }
              if (parenDepth !== 0) continue
              if (ch === '\r' || ch === '\n' || ch === ';') {
                flush(i)
                start = i + 1
                continue
              }
              if (ch === '.') {
                const next = policyText[i + 1]
                if (next === undefined || /\s/u.test(next)) {
                  flush(i)
                  start = i + 1
                }
                continue
              }
              if (ch === ',') {
                const leftTrimmed = policyText.slice(start, i).trim().replace(/^(?:and|plus)\s+/iu, '')
                const rightTail = policyText.slice(i + 1)
                const isActiveCommitList =
                  ACTIVE_COMMIT_LIST_LEFT_RE.test(leftTrimmed) && /^[ \t]*(?:and\b[ \t]*)?[0-9a-f]{7,40}\b/iu.test(rightTail)
                const isActiveUpstreamList =
                  ACTIVE_UPSTREAM_LIST_LEFT_RE.test(leftTrimmed) && ACTIVE_UPSTREAM_LIST_RIGHT_RE.test(rightTail)
                if (!isActiveCommitList && !isActiveUpstreamList) {
                  flush(i)
                  start = i + 1
                }
              }
            }
            flush(policyText.length)
            return clauses
          }

          const trimAscii = (value) => value.replace(/^[ \t]+|[ \t]+$/gu, '')
          const hasVisibleNonWhitespace = (value) => value.replace(/[\p{White_Space}\ufeff\p{Cf}]+/gu, '').length > 0
          function assertValidWorkBranch(branch, fieldLabel) {
            assert.ok(
              typeof branch === 'string' &&
                WORK_BRANCH_REF_RE.test(branch) &&
                !branch.includes('..') &&
                !branch.endsWith('.lock') &&
                !branch.endsWith('.'),
              `${fieldLabel} must be a valid Git branch ref (work/<issue>-<slug>, main, or stable/<x>.<y>.x): ${branch}`,
            )
          }

          function decodeYamlScalar(raw, fieldLabel) {
            assert.ok(typeof raw === 'string' && !DISALLOWED_INVISIBLE_RE.test(raw), `Unsupported BOM/invisible format character in YAML scalar for ${fieldLabel}: ${raw}`)
            const trimmed = trimAscii(raw)
            assert.ok(trimmed && !trimmed.startsWith('#'), `Empty or null YAML scalar for ${fieldLabel}: ${raw}`)
            if (trimmed.startsWith('"')) {
              let end = -1, escaped = false
              for (let i = 1; i < trimmed.length; i += 1) {
                if (escaped) { escaped = false; continue }
                if (trimmed[i] === '\\') { escaped = true; continue }
                if (trimmed[i] === '"') { end = i; break }
              }
              assert.ok(end !== -1, `Unterminated double-quoted scalar for ${fieldLabel}: ${raw}`)
              const tail = trimmed.slice(end + 1)
              assert.ok(tail === '' || /^[ \t]+(?:#.*)?$/u.test(tail), `Unexpected trailing content for ${fieldLabel}: ${raw}`)
              const decoded = JSON.parse(trimmed.slice(0, end + 1))
              assert.ok(typeof decoded === 'string' && hasVisibleNonWhitespace(decoded), `YAML scalar for ${fieldLabel} must be non-empty`)
              assert.ok(!DISALLOWED_INVISIBLE_RE.test(decoded), `Unsupported invisible/BOM format character in decoded YAML scalar for ${fieldLabel}: ${raw}`)
              return decoded
            }
            if (trimmed.startsWith("'")) {
              let end = -1
              for (let i = 1; i < trimmed.length; i += 1) {
                if (trimmed[i] === "'") {
                  if (trimmed[i + 1] === "'") { i += 1; continue }
                  end = i; break
                }
              }
              assert.ok(end !== -1, `Unterminated single-quoted scalar for ${fieldLabel}: ${raw}`)
              const tail = trimmed.slice(end + 1)
              assert.ok(tail === '' || /^[ \t]+(?:#.*)?$/u.test(tail), `Unexpected trailing content for ${fieldLabel}: ${raw}`)
              const decoded = trimmed.slice(1, end).replace(/''/gu, "'")
              assert.ok(hasVisibleNonWhitespace(decoded), `YAML scalar for ${fieldLabel} must be non-empty`)
              assert.ok(!DISALLOWED_INVISIBLE_RE.test(decoded), `Unsupported invisible/BOM format character in decoded YAML scalar for ${fieldLabel}: ${raw}`)
              return decoded
            }
            const comment = /[ \t]+#/u.exec(trimmed)
            const scalar = trimAscii(comment ? trimmed.slice(0, comment.index) : trimmed)
            assert.ok(scalar.length > 0, `Empty YAML scalar for ${fieldLabel}: ${raw}`)
            assert.ok(!/[^\P{White_Space} \t]|[\ufeff\p{Cf}]/u.test(scalar), `Unsupported non-ASCII whitespace or invisible format character in YAML scalar for ${fieldLabel}: ${raw}`)
            assert.ok(!YAML_NULL_OR_BOOL_RE.test(scalar), `Unquoted YAML null/boolean literal is forbidden for ${fieldLabel}: ${raw}`)
            assert.ok(!UNSUPPORTED_PREFIX_RE.test(scalar), `Unsupported YAML syntax for ${fieldLabel}: ${raw}`)
            assert.ok(!UNSUPPORTED_TOKENS_RE.test(scalar), `Unsupported YAML collection token for ${fieldLabel}: ${raw}`)
            assert.ok(scalar !== '-' && !scalar.startsWith('- '), `Unexpected sequence item for ${fieldLabel}: ${raw}`)
            assert.ok(!scalar.startsWith(':') && !/:[ \t]/u.test(scalar) && !/:\p{White_Space}/u.test(scalar), `Unexpected mapping syntax for ${fieldLabel}: ${raw}`)
            return scalar
          }

          assert.ok(!DISALLOWED_INVISIBLE_RE.test(manifestText), 'Unsupported BOM/invisible format character in release manifest')
          const top = new Map()
          const sections = new Map()
          const nestedSectionKeys = new Map()
          let currentSection = null
          let currentNestedKey = null
          for (const rawLine of manifestText.split(/\r?\n/u)) {
            if (/^[ \t]*$/u.test(rawLine)) continue
            assert.ok(!/^ *\t/u.test(rawLine), `Tab indentation is forbidden in release manifest: ${rawLine}`)
            const indent = /^( *)/u.exec(rawLine)[1].length
            const trimmed = rawLine.slice(indent).replace(/[ \t]+$/u, '')
            assert.ok(!/^\p{White_Space}/u.test(trimmed), `Invalid non-ASCII whitespace in indentation for release manifest: ${rawLine}`)
            if (trimmed.startsWith('#')) continue
            if (indent === 0) {
              currentSection = null
              currentNestedKey = null
              const m = /^([A-Za-z0-9_]+):(?:[ \t]+(.*))?$/u.exec(trimmed)
              assert.ok(m, `Malformed top-level YAML line: ${rawLine}`)
              const key = m[1]
              const rest = trimAscii(m[2] ?? '')
              assert.ok(!top.has(key) && !sections.has(key), `Duplicate YAML top-level key "${key}"`)
              if (!rest || rest.startsWith('#')) {
                assert.ok(!CONTROL_TOP_KEYS.has(key), `Control field "${key}" must be a non-empty scalar`)
                currentSection = key
                sections.set(key, new Map())
                nestedSectionKeys.set(key, new Set())
              } else {
                top.set(key, decodeYamlScalar(rest, key))
              }
              continue
            }
            assert.ok(currentSection !== null, `Unexpected indented YAML line outside section: ${rawLine}`)
            const inControlSection = CONTROL_SECTIONS.has(currentSection)
            if (indent === 2) {
              if (trimmed.startsWith('-')) {
                assert.ok(!inControlSection && currentSection !== 'source', `YAML list items are forbidden in section "${currentSection}"`)
                continue
              }
              const m = /^([A-Za-z0-9_]+):(?:[ \t]+(.*))?$/u.exec(trimmed)
              assert.ok(m, `Malformed YAML entry in section "${currentSection}": ${rawLine}`)
              const key = m[1]
              const rest = trimAscii(m[2] ?? '')
              const sec = sections.get(currentSection)
              const nested = nestedSectionKeys.get(currentSection)
              assert.ok(!sec.has(key) && !nested.has(key), `Duplicate YAML key "${currentSection}.${key}"`)
              nested.add(key)
              const allowListInSection = !inControlSection && (currentSection !== 'source' || key === 'engineering_issues')
              if (!rest || rest.startsWith('#')) {
                assert.ok(allowListInSection, `Empty or null YAML value for scalar field "${currentSection}.${key}"`)
                currentNestedKey = key
              } else {
                currentNestedKey = null
                if (!allowListInSection) {
                  sec.set(key, decodeYamlScalar(rest, `${currentSection}.${key}`))
                } else if (!/^\[.*\]$/u.test(trimAscii(rest.replace(/[ \t]+#.*$/u, '')))) {
                  sec.set(key, decodeYamlScalar(rest, `${currentSection}.${key}`))
                }
              }
              continue
            }
            assert.ok(!inControlSection && (currentSection !== 'source' || currentNestedKey === 'engineering_issues'), `Unexpected nested indentation in section "${currentSection}": ${rawLine}`)
            assert.ok(currentNestedKey !== null && trimmed.startsWith('-'), `Unsupported nested YAML line in "${currentSection}": ${rawLine}`)
          }

          assert.equal(pkg.name, 'dsh-lcx-codex', `Expected package name dsh-lcx-codex, got ${pkg.name}`)
          assert.equal(typeof pkg.version, 'string', 'package.json version must be a string')
