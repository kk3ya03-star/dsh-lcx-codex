          }
          for (const dshMatch of verificationPolicy.matchAll(
            /\bdsh\b(?:(?:\s*[:=/(-]\s*|\s+)(?:version|runtime|baseline|is|at|on|build))*[ \t]*[:=/(-]?[ \t]*v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\b/giu,
