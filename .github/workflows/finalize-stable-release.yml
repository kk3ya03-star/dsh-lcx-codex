            const ddRemaining = cdOffset - dataEnd
            let ddCrc
            let ddCompressedSize
            let ddUncompressedSize
            if (ddRemaining === 16 && zip.readUInt32LE(dataEnd) === 0x08074b50) {
              ddCrc = zip.readUInt32LE(dataEnd + 4)
              ddCompressedSize = zip.readUInt32LE(dataEnd + 8)
              ddUncompressedSize = zip.readUInt32LE(dataEnd + 12)
            } else if (ddRemaining === 12) {
              ddCrc = zip.readUInt32LE(dataEnd)
              ddCompressedSize = zip.readUInt32LE(dataEnd + 4)
              ddUncompressedSize = zip.readUInt32LE(dataEnd + 8)
            } else {
              assert.fail(`Invalid or missing ZIP data descriptor (remaining bytes: ${ddRemaining})`)
            }
            assert.equal(ddCrc, cdCrc, 'ZIP data descriptor CRC32 mismatches central directory')
            assert.equal(ddCompressedSize, cdCompressedSize, 'ZIP data descriptor compressed size mismatches central directory')
            assert.equal(ddUncompressedSize, cdUncompressedSize, 'ZIP data descriptor uncompressed size mismatches central directory')
          } else {
            assert.equal(dataEnd, cdOffset, 'Unexpected trailing bytes between ZIP payload and central directory')
          }
          const rawData = zip.subarray(dataStart, dataEnd)
          assert.equal(rawData.length, cdCompressedSize, 'Truncated ZIP entry payload')
          let content = null
          if (cdMethod === 0) {
            assert.equal(cdCompressedSize, cdUncompressedSize, 'Stored ZIP compressed size must equal uncompressed size')
            content = rawData
          } else if (cdMethod === 8) {
            const inflated = inflateRawSync(rawData, { info: true, maxOutputLength: MAX_ARTIFACT_BYTES })
