              inflated.engine?.bytesWritten,
              rawData.length,
              `Trailing compressed bytes after DEFLATE stream (${inflated.engine?.bytesWritten} !== ${rawData.length})`,
            )
            content = inflated.buffer
          }
          assert.ok(content !== null, `Unsupported ZIP compression method: ${cdMethod}`)
          assert.equal(content.length, cdUncompressedSize, `Inflated ZIP payload length ${content.length} mismatches expected ${cdUncompressedSize}`)
          assert.equal(crc32(content) >>> 0, cdCrc, 'ZIP payload CRC32 mismatch')
          writeFileSync(process.env.OUT_TAR_FILE, content)
          EOF
          if [[ ! -f "$TAR_FILE" || ! -s "$TAR_FILE" ]]; then
            echo "Downloaded verified-public-package artifact is missing dsh-lcx-codex-${VERSION}.tgz" >&2
            exit 1
          fi
          export TAR_FILE
          node --input-type=module - <<'EOF'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readFileSync } from 'node:fs'
          const buf = readFileSync(process.env.TAR_FILE)
          const shasum = createHash('sha1').update(buf).digest('hex')
          const integrity = `sha512-${createHash('sha512').update(buf).digest('base64')}`
          if (process.env.GITHUB_OUTPUT) {
            appendFileSync(process.env.GITHUB_OUTPUT, `artifact_shasum=${shasum}\nartifact_integrity=${integrity}\n`, 'utf8')
          }
          if (process.env.GITHUB_ENV) {
            appendFileSync(process.env.GITHUB_ENV, `LCX_ARTIFACT_SHASUM=${shasum}\nLCX_ARTIFACT_INTEGRITY=${integrity}\n`, 'utf8')
          }
          EOF
      - name: Verify registry convergence and create or validate GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.policy.outputs.tag || env.LCX_TAG }}
          VERSION: ${{ steps.policy.outputs.version || env.LCX_VERSION }}
          TARGET_BRANCH: ${{ steps.policy.outputs.target_branch || env.LCX_TARGET_BRANCH }}
          DIST_TAG: ${{ steps.policy.outputs.dist_tag || env.LCX_DIST_TAG }}
          STABLE_REMAIN: ${{ steps.policy.outputs.stable_latest_remain || env.LCX_STABLE_REMAIN }}
          ARTIFACT_SHASUM: ${{ steps.publish_evidence.outputs.artifact_shasum || env.LCX_ARTIFACT_SHASUM }}
          ARTIFACT_INTEGRITY: ${{ steps.publish_evidence.outputs.artifact_integrity || env.LCX_ARTIFACT_INTEGRITY }}
        shell: bash
        run: |
          set -euo pipefail

          verify_existing_release() {
            local prerelease draft
            prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')"
            draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')"
            [[ "$prerelease" == "false" && "$draft" == "false" ]]
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            verify_existing_release
            DIST_TAGS_JSON="$(npm view dsh-lcx-codex dist-tags --json --registry=https://registry.npmjs.org)"
            export DIST_TAGS_JSON
            node --input-type=module - <<'EOF'
            import assert from 'node:assert/strict'
            const version = process.env.VERSION ?? ''
            const distTag = process.env.DIST_TAG ?? ''
            const targetBranch = process.env.TARGET_BRANCH ?? ''
            const stableRemain = process.env.STABLE_REMAIN ?? ''
            const res = await fetch(`https://registry.npmjs.org/dsh-lcx-codex/${encodeURIComponent(version)}`)
            if (res.status !== 200) throw new Error(`Expected published npm package for existing release ${process.env.TAG}, got HTTP ${res.status}`)
            const doc = await res.json()
            assert.equal(doc?.dist?.shasum, process.env.ARTIFACT_SHASUM)
            assert.equal(doc?.dist?.integrity, process.env.ARTIFACT_INTEGRITY)

            const tags = JSON.parse((process.env.DIST_TAGS_JSON ?? '').trim() || '{}')
            const tagVer = tags && typeof tags === 'object' && Object.prototype.hasOwnProperty.call(tags, distTag) && typeof tags[distTag] === 'string' ? tags[distTag] : undefined
            assert.equal(tagVer, version, `Existing release expected npm dist-tag ${distTag} to equal ${version}, got ${tagVer}.`)
            if (targetBranch !== 'main' || distTag !== 'latest') {
              const latestVer = tags && typeof tags === 'object' && Object.prototype.hasOwnProperty.call(tags, 'latest') && typeof tags.latest === 'string' ? tags.latest : undefined
              assert.equal(latestVer, stableRemain, `Existing maintenance release expected npm latest to remain ${stableRemain}, got ${latestVer}.`)
            }
          EOF
            echo "Stable GitHub Release already exists and is final."
            exit 0
          fi

          MAX_ATTEMPTS="${LCX_CONVERGE_ATTEMPTS:-30}"
          SLEEP_SEC="${LCX_CONVERGE_SLEEP_SEC:-3}"
          converged=false
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            DIST_TAGS_JSON="$(npm view dsh-lcx-codex dist-tags --json --registry=https://registry.npmjs.org 2>/dev/null || true)"
            export DIST_TAGS_JSON
            status=0
            node --input-type=module - <<'EOF' || status=$?
            import assert from 'node:assert/strict'
            const version = process.env.VERSION ?? ''
            const distTag = process.env.DIST_TAG ?? ''
            const targetBranch = process.env.TARGET_BRANCH ?? ''
            const stableRemain = process.env.STABLE_REMAIN ?? ''
            const artifactShasum = process.env.ARTIFACT_SHASUM ?? ''
            const artifactIntegrity = process.env.ARTIFACT_INTEGRITY ?? ''

            const res = await fetch(`https://registry.npmjs.org/dsh-lcx-codex/${encodeURIComponent(version)}`)
            if (res.status !== 200 && res.status !== 404) {
              console.error(`Registry lookup for dsh-lcx-codex@${version} failed with HTTP ${res.status}`)
              process.exit(2)
            }
            if (res.status === 404) process.exit(10)

            const remoteDoc = await res.json()
            assert.equal(remoteDoc?.dist?.shasum, artifactShasum, `Published npm shasum (${remoteDoc?.dist?.shasum}) mismatches verified artifact (${artifactShasum}).`)
            assert.equal(remoteDoc?.dist?.integrity, artifactIntegrity, `Published npm integrity (${remoteDoc?.dist?.integrity}) mismatches verified artifact (${artifactIntegrity}).`)

            const raw = (process.env.DIST_TAGS_JSON ?? '').trim()
            if (!raw) process.exit(10)
            const tags = JSON.parse(raw)
            const tagVer = tags && typeof tags === 'object' && Object.prototype.hasOwnProperty.call(tags, distTag) && typeof tags[distTag] === 'string' ? tags[distTag] : undefined
            if (tagVer !== version) process.exit(10)

            if (targetBranch !== 'main' || distTag !== 'latest') {
              const latestVer = tags && typeof tags === 'object' && Object.prototype.hasOwnProperty.call(tags, 'latest') && typeof tags.latest === 'string' ? tags.latest : undefined
              assert.equal(latestVer, stableRemain, `Maintenance release expected npm latest to remain ${stableRemain}, got ${latestVer}.`)
            }
          EOF
            if [[ "$status" -eq 0 ]]; then
              converged=true
              break
            elif [[ "$status" -ne 10 ]]; then
              exit "$status"
            fi
            if [[ "$attempt" -lt "$MAX_ATTEMPTS" && "$SLEEP_SEC" != "0" ]]; then
              sleep "$SLEEP_SEC"
            fi
          done
          if [[ "$converged" != true ]]; then
            echo "npm publication dsh-lcx-codex@$VERSION on dist-tag $DIST_TAG did not converge." >&2
            exit 1
          fi

          RELEASE_ARGS=(
            --verify-tag
            --title "$TAG"
            --notes "Stable release dsh-lcx-codex@$VERSION. See README and CHANGELOG for the verified DSH compatibility range and feature details. npm $DIST_TAG: dsh-lcx-codex@$VERSION."
          )
          if [[ "$TARGET_BRANCH" != "main" || "$DIST_TAG" != "latest" ]]; then
            RELEASE_ARGS+=(--latest=false)
          else
            RELEASE_ARGS+=(--latest)
          fi
          if ! gh release create "$TAG" "${RELEASE_ARGS[@]}"; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              verify_existing_release
              echo "Stable GitHub Release already exists and is final."
              exit 0
            fi
            exit 1
          fi
