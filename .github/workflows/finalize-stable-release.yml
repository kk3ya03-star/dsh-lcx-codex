          const positivePoRe = /^(?:private-issue-\d+-po-approved-\d{4}-\d{2}-\d{2}|po[-_]approved(?:[-_]\d{4}-\d{2}-\d{2})?|approved[-_]by[-_]product[-_]owner)$/iu
