          assert.equal(basisDsh, pkgDsh, 'runtime_basis.dsh must match package.json')
          assert.equal(basisPluginPi, pkgPluginPi, 'runtime_basis.plugin_pi must match package.json')
          assert.equal(basisHostPi, pkgHostPi, 'runtime_basis.host_pi must match package.json')
          assert.equal(pkgVerifiedPluginPi, pkgPluginPi, 'lcxCompatibility.verifiedPluginPi must match package.json')
