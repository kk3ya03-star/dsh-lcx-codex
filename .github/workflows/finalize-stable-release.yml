          }
          const nonUpstreamPolicy = verificationPolicy.replace(
            /\b(?:upstream|dsh|pi(?:-ai)?|openai|xai)\s+(?:issue[-\s#]*\d+|#\d+)\b/giu,
            ' ',
          )
          for (const issueMatch of nonUpstreamPolicy.matchAll(/\bissue-(\d+)\b/giu)) {
            assert.equal(
              issueMatch[1],
              sourceIssue,
              `Stale or mismatched issue reference #${issueMatch[1]} in verification.policy (expected #${sourceIssue})`,
            )
          }
          const escapedBasisDsh = escapeRegExp(basisDsh)
          const escapedSourceIssue = escapeRegExp(sourceIssue)
          const escapedVersion = escapeRegExp(version)
          const clauseNegationOrFutureRe =
            /\b(?:not|never|no|without|neither|nor|none|zero|did|do|does|can|cannot|will|shall|could|would|should|might|may|once|when|if|unless|until|whether|assuming|plan|plans|planned|planning|proposal|proposed|hypothetical|hypothetically|example|examples|sample|samples|dry[\s-]+run|simulator|simulators|simulation|simulated|emulator|emulators|emulated|synthetic|stub|stubs|stubbed|double|doubles|caveat|caveats|nominal|except|however|but|although|despite|harness[\s-]+only|illustrative|unknown|unclear|unconfirmed|unproven|untested|uncertain|undetermined|pending|blocked|failed|skipped|incomplete|partial|awaiting|outstanding|deferred|missing|absent|lacks?|tomorrow|later|soon|expected|scheduled|upcoming|yet|todo|tbd|wip|draft|mock|mocks|mocked|fake|placeholder|waived|bypassed|omitted)\b|\bonly[\s-]+in\b|\bno[\s-]+sign\b|\b[A-Za-z]+n't\b/iu
          const qaDocPathSrc = `docs\\/qa\\/issue-${escapedSourceIssue}\\/[A-Za-z0-9._-]+`
          const issueRefSrc = `(?:private[\\s_-]+issue[\\s_-]*#?${escapedSourceIssue}|issue[\\s_-]*#?${escapedSourceIssue}|#${escapedSourceIssue})`
          const dshRefSrc = `(?:(?:the\\s+)?(?:exact|real|isolated)\\s+dsh\\s+${escapedBasisDsh}|dsh\\s+${escapedBasisDsh})`
          const qaDocPathExactRe = new RegExp(`^${qaDocPathSrc}$`, 'u')
          const qaDshExactRe = new RegExp(`^(?:exact\\s+)?dsh\\s+${escapedBasisDsh}$`, 'iu')
          const qaIssueExactRe = new RegExp(`^${issueRefSrc}$`, 'iu')
          const isValidQaParentheticalItem = (rawItem) => {
            const item = rawItem.trim().replace(/\s+/gu, ' ')
            if (!item) return false
            if (/^both stop conditions not hit$/iu.test(item)) return true
            if (qaDocPathExactRe.test(item) || qaDshExactRe.test(item) || qaIssueExactRe.test(item)) return true
            return parseAndVerifyCommitExpression(item, assertPolicyCommitSha)
          }

          const scopePrepPhraseSrc = `(?:\\s+(?:(?:on|for|under|with)\\s+${dshRefSrc}|(?:for|under|in)\\s+(?:${issueRefSrc}|${qaDocPathSrc})|on\\s+\\d{4}-\\d{2}-\\d{2}|(?:for|of)\\s+(?:v?${escapedVersion}|this\\s+(?:candidate|release)))){0,3}`
          const directClausePrefixSrc = `(?:(?:the\\s+)?(?:real|isolated|full|manual)\\s+(?:dsh\\s+)?(?:${escapedBasisDsh}\\s+)?|(?:the\\s+)?exact\\s+dsh\\s+${escapedBasisDsh}\\s+|(?:the\\s+)?engineering\\s+gates\\s*(?:\\+|&|and)\\s*|the\\s+)?`
          const affirmativeQaCoreRe = new RegExp(
            `^(?:${directClausePrefixSrc}runtime[\\s-]+qa${scopePrepPhraseSrc}\\s+(?:(?:is|was|are|were|has\\s+been|have\\s+been|has|have)\\s+)?(?:passed|complete(?:d)?|verified|accepted|checked)${scopePrepPhraseSrc}|(?:passed|completed|verified|accepted|checked)\\s+(?:the\\s+)?(?:(?:real|isolated|full|manual)\\s+)?(?:dsh\\s+(?:${escapedBasisDsh}\\s+)?)?runtime[\\s-]+qa${scopePrepPhraseSrc})$`,
            'iu',
          )
          const isRuntimeQaCompletionClause = (clause) => {
            let core = clause
            while (core.endsWith(')')) {
              const openIdx = core.lastIndexOf('(')
              if (openIdx === -1) return false
              const inner = core.slice(openIdx + 1, -1).trim()
              if (!inner) return false
              const items = inner.split(';')
              if (!items.every(isValidQaParentheticalItem)) return false
              core = core.slice(0, openIdx).trim()
            }
            if (!core || core.includes('(') || core.includes(')')) return false
            return affirmativeQaCoreRe.test(core) && !clauseNegationOrFutureRe.test(core)
          }

          const commitScopeSuffixRe = new RegExp(
            `(?:\\s+(?:under|for|on)\\s+(?:${qaDocPathSrc}|${issueRefSrc}|${dshRefSrc}))+$`,
            'iu',
          )
          const isCommitAttestationClause = (clause) => {
            if (clause.includes('(') || clause.includes(')')) return false
            const stripped = clause.replace(commitScopeSuffixRe, '').trim()
            return stripped.length > 0 && parseAndVerifyCommitExpression(stripped, assertPolicyCommitSha)
          }

          const qaDocRefClauseRe = new RegExp(
            `^(?:(?:recorded|verified|documented|see)\\s+(?:under|in|at)\\s+)?(?:(?:${issueRefSrc}(?:\\s+(?:and|under))?\\s*)|${qaDocPathSrc})+$`,
            'iu',
          )
          const engineeringGatesClauseRe = new RegExp(
            `^(?:all\\s+)?(?:engineering(?:\\s+and\\s+contract)?\\s+gates|tl\\s+(?:engineering\\s+)?review|technical\\s+lead\\s+(?:acceptance|review))(?:\\s+(?:on|for)\\s+(?:${dshRefSrc}|${issueRefSrc}|v?${escapedVersion}))*\\s+(?:passed|complete(?:d)?|accepted|verified)(?:\\s+(?:on|for|under)\\s+(?:${dshRefSrc}|${issueRefSrc}|${qaDocPathSrc}|v?${escapedVersion}))*$`,
            'iu',
          )
          const upstreamTrackingClauseRe = new RegExp(
            `^${UPSTREAM_LEAD_SRC}(?:${UPSTREAM_LIST_SEP_SRC}${UPSTREAM_TAIL_ITEM_SRC})*\\s+(?:remains?|are|is)\\s+(?:tracked|open|non-blocking|out-of-scope)(?:\\s+upstream)?$`,
            'iu',
          )
          const isAllowedClosedClause = (clause) =>
            isRuntimeQaCompletionClause(clause) ||
            isCommitAttestationClause(clause) ||
            qaDocRefClauseRe.test(clause) ||
            engineeringGatesClauseRe.test(clause) ||
            upstreamTrackingClauseRe.test(clause)

          let clauses = null
          let parenParseErr = null
          try {
            clauses = splitTopLevelVerificationClauses(verificationPolicy)
          } catch (err) {
            parenParseErr = err
          }
          const verificationPolicyForDenylist = clauses
            ? clauses
                .map((clause) => (isRuntimeQaCompletionClause(clause) ? sanitizeValidatedQaClauseForDenylist(clause) : clause))
                .join(' ; ')
            : verificationPolicy
          assert.ok(
            !pendingOrBlockedVerificationPolicyRe.test(verificationPolicyForDenylist) &&
              !/\bnot\b/iu.test(verificationPolicyForDenylist) &&
              !/\bpost[\s_-]+release\b/iu.test(verificationPolicyForDenylist),
            'verification.policy must not contain pending, blocked, failed, unverified, incomplete, or no-runtime-claim language',
          )
          if (parenParseErr) throw parenParseErr

          assert.ok(
            clauses.length > 0 && clauses.some(isRuntimeQaCompletionClause),
            'verification.policy must affirmatively state completed runtime QA',
          )
          const invalidClauses = clauses.filter((clause) => !isAllowedClosedClause(clause))
          assert.equal(
            invalidClauses.length,
            0,
            `verification.policy contains unrecognized clause: ${invalidClauses[0]}`,
          )
          const publication = sections.get('publication')
          assert.equal(publication?.get('state'), 'APPROVED_PENDING_PUBLISH', 'Manifest publication.state must be APPROVED_PENDING_PUBLISH')

          const publicTarget = sections.get('public_target')
          assert.equal(publicTarget?.get('tag'), tag, 'Manifest public_target.tag must match release tag')
          const targetBranch = publicTarget?.get('branch')
          assert.ok(targetBranch, 'Manifest public_target.branch is required')
          assert.match(targetBranch, /^(?:main|stable\/\d+\.\d+\.x)$/u)
          const distTag = publicTarget?.get('npm_dist_tag')
          assert.ok(distTag, 'Manifest public_target.npm_dist_tag is required')
          const previousLatestMustBe = publicTarget?.get('previous_latest_must_be') ?? ''
          const stableLatestMustRemain = publicTarget?.get('stable_latest_must_remain') ?? ''

          const versionMinor = `${parsedVersion.major}.${parsedVersion.minor}`
          if (targetBranch === 'main') {
            assert.equal(distTag, 'latest', `Main branch must use npm_dist_tag latest, got ${distTag}`)
            assert.equal(stableLatestMustRemain, '', 'Stable main release must not set public_target.stable_latest_must_remain')
            assert.ok(previousLatestMustBe, 'Stable main release must record previous_latest_must_be')
            const parsedPrev = parseStrictSemver(previousLatestMustBe, 'public_target.previous_latest_must_be')
            assert.equal(parsedPrev.prerelease.length, 0, 'previous_latest_must_be must be stable SemVer')
            assert.equal(parsedPrev.build.length, 0, 'public_target.previous_latest_must_be must not contain build metadata')
            assert.ok(compareSemver(parsedVersion, parsedPrev) > 0, `Stable release ${version} must advance latest beyond ${previousLatestMustBe}`)
          } else {
            const expectedBranch = `stable/${versionMinor}.x`
            const expectedDistTag = `stable-${versionMinor}`
            assert.equal(targetBranch, expectedBranch, `Unsupported stable target branch ${targetBranch}`)
            assert.equal(distTag, expectedDistTag, `Maintenance branch requires npm_dist_tag ${expectedDistTag}, got ${distTag}`)
            assert.equal(previousLatestMustBe, '', `Maintenance branch ${targetBranch} must not set public_target.previous_latest_must_be`)
            assert.ok(stableLatestMustRemain, `Maintenance branch ${targetBranch} must record stable_latest_must_remain`)
            const parsedRemain = parseStrictSemver(stableLatestMustRemain, 'public_target.stable_latest_must_remain')
            assert.equal(parsedRemain.prerelease.length, 0, 'stable_latest_must_remain must be stable SemVer')
            assert.equal(parsedRemain.build.length, 0, 'public_target.stable_latest_must_remain must not contain build metadata')
          }

          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u)
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u)
          assert.match(targetBranch, /^(?:main|stable\/\d+\.\d+\.x)$/u)
          assert.match(distTag, /^(?:latest|stable-\d+\.\d+)$/u)
          assert.match(targetSha, /^[0-9a-f]{40,64}$/iu)
          if (previousLatestMustBe) assert.match(previousLatestMustBe, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u)
          if (stableLatestMustRemain) assert.match(stableLatestMustRemain, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u)

          if (process.env.GITHUB_OUTPUT) {
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              [
                `tag=${tag}`,
                `version=${version}`,
                `target_branch=${targetBranch}`,
                `dist_tag=${distTag}`,
                `previous_latest=${previousLatestMustBe}`,
                `stable_latest_remain=${stableLatestMustRemain}`,
                `target_sha=${targetSha}`,
              ].join('\n') + '\n',
              'utf8',
            )
          }
          if (process.env.GITHUB_ENV) {
            appendFileSync(
              process.env.GITHUB_ENV,
              [
                `LCX_TAG=${tag}`,
                `LCX_VERSION=${version}`,
                `LCX_TARGET_BRANCH=${targetBranch}`,
                `LCX_DIST_TAG=${distTag}`,
                `LCX_PREVIOUS_LATEST=${previousLatestMustBe}`,
                `LCX_STABLE_REMAIN=${stableLatestMustRemain}`,
                `LCX_TARGET_SHA=${targetSha}`,
              ].join('\n') + '\n',
              'utf8',
            )
          }
          EOF

          BRANCH="${LCX_TARGET_BRANCH:-}"
          if [[ -z "$BRANCH" ]]; then
            BRANCH="$(grep '^LCX_TARGET_BRANCH=' "${GITHUB_ENV:-/dev/null}" 2>/dev/null | tail -n 1 | cut -d= -f2- || true)"
          fi
          if ! git rev-parse -q --verify "refs/remotes/origin/${BRANCH}" >/dev/null 2>&1 || \
             ! git merge-base --is-ancestor "$TARGET" "refs/remotes/origin/${BRANCH}"; then
            echo "Stable tag $TAG ($TARGET) is not an ancestor of target branch origin/${BRANCH}." >&2
            exit 1
          fi
      - name: Verify Publish to npm run and verified-public-package artifact
        id: publish_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || inputs.workflow_run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.workflow_run_attempt }}
          TAG: ${{ steps.policy.outputs.tag || env.LCX_TAG }}
          VERSION: ${{ steps.policy.outputs.version || env.LCX_VERSION }}
          TARGET_SHA: ${{ steps.policy.outputs.target_sha || env.LCX_TARGET_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKFLOW_RUN_ID:-}" && ! "${WORKFLOW_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid workflow_run_id '${WORKFLOW_RUN_ID}'." >&2
            exit 1
          fi
          if [[ -n "${WORKFLOW_RUN_ATTEMPT:-}" ]]; then
            if [[ -z "${WORKFLOW_RUN_ID:-}" ]]; then
              echo "workflow_run_attempt requires workflow_run_id." >&2
              exit 1
            fi
            if [[ ! "${WORKFLOW_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid workflow_run_attempt '${WORKFLOW_RUN_ATTEMPT}'." >&2
              exit 1
            fi
          fi
          if [[ "${EVENT_NAME:-}" == "workflow_run" ]]; then
            if [[ -z "${WORKFLOW_RUN_ID:-}" || -z "${WORKFLOW_RUN_ATTEMPT:-}" ]]; then
              echo "workflow_run requires both non-empty positive WORKFLOW_RUN_ID and WORKFLOW_RUN_ATTEMPT." >&2
              exit 1
            fi
          elif [[ "${EVENT_NAME:-}" != "workflow_dispatch" ]]; then
            echo "Unsupported trigger event '${EVENT_NAME:-}'." >&2
            exit 1
          fi
          WORKFLOW_META_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml")"
          if [[ -n "${WORKFLOW_RUN_ID:-}" && -n "${WORKFLOW_RUN_ATTEMPT:-}" ]]; then
            RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/attempts/${WORKFLOW_RUN_ATTEMPT}")"
          elif [[ -n "${WORKFLOW_RUN_ID:-}" ]]; then
            RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}")"
          else
            RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?head_sha=${TARGET_SHA}&status=success&per_page=100")"
          fi
          export WORKFLOW_META_JSON RUN_JSON
          PUBLISH_RUN_ID="$(node --input-type=module - <<'EOF'
          import assert from 'node:assert/strict'
          const eventName = process.env.EVENT_NAME ?? ''
          const tag = process.env.TAG ?? ''
          const targetSha = process.env.TARGET_SHA ?? ''
          const parsePositiveDecimal = (value, label) => {
            const rawStr = typeof value === 'number'
              ? (Number.isSafeInteger(value) && value > 0 ? String(value) : '')
              : typeof value === 'string' && /^[1-9]\d*$/u.test(value)
                ? value
                : ''
            assert.ok(rawStr.length > 0, `Invalid ${label}: ${String(value)}`)
            return rawStr
          }
          const expectedRunId = process.env.WORKFLOW_RUN_ID ? parsePositiveDecimal(process.env.WORKFLOW_RUN_ID, 'WORKFLOW_RUN_ID') : undefined
          const expectedRunAttempt = process.env.WORKFLOW_RUN_ATTEMPT ? parsePositiveDecimal(process.env.WORKFLOW_RUN_ATTEMPT, 'WORKFLOW_RUN_ATTEMPT') : undefined
          if (eventName === 'workflow_run') {
            assert.ok(expectedRunId !== undefined && expectedRunAttempt !== undefined, 'workflow_run requires pinned WORKFLOW_RUN_ID and WORKFLOW_RUN_ATTEMPT')
          } else {
            assert.equal(eventName, 'workflow_dispatch', `Unsupported trigger event ${eventName}`)
          }
          const workflowMeta = JSON.parse(process.env.WORKFLOW_META_JSON ?? '{}')
          assert.ok(
            (typeof workflowMeta?.id === 'number' && Number.isSafeInteger(workflowMeta.id) && workflowMeta.id > 0) ||
              (typeof workflowMeta?.id === 'string' && /^[1-9]\d*$/u.test(workflowMeta.id)),
            'Missing canonical publish.yml workflow id',
          )
          const canonicalWorkflowId = BigInt(workflowMeta.id)
          assert.equal(workflowMeta?.path, '.github/workflows/publish.yml', `Unexpected publish workflow path: ${workflowMeta?.path}`)
          const raw = JSON.parse(process.env.RUN_JSON ?? '{}')
          const candidates = Array.isArray(raw.workflow_runs) ? raw.workflow_runs : [raw]
          const hasCanonicalPublishPath = (rawPath) => {
            if (typeof rawPath !== 'string') return false
            const atIdx = rawPath.indexOf('@')
            if (atIdx === -1) return rawPath === '.github/workflows/publish.yml'
            const wfPath = rawPath.slice(0, atIdx)
            const wfRef = rawPath.slice(atIdx + 1)
            return wfPath === '.github/workflows/publish.yml' && (wfRef === tag || wfRef === `refs/tags/${tag}`)
          }
          const positiveDecimalOrNull = (val) => {
            if (typeof val === 'number') return Number.isSafeInteger(val) && val > 0 ? String(val) : null
            if (typeof val === 'string' && /^[1-9]\d*$/u.test(val)) return val
            return null
          }
          const match = candidates.find((run) => {
            if (!run) return false
            const runWorkflowId = positiveDecimalOrNull(run.workflow_id)
            const runId = positiveDecimalOrNull(run.id)
            const runAttempt = positiveDecimalOrNull(run.run_attempt)
            return (
              runWorkflowId !== null &&
              BigInt(runWorkflowId) === canonicalWorkflowId &&
              runId !== null &&
              hasCanonicalPublishPath(run.path) &&
              run.event === 'push' &&
              run.name === 'Publish to npm' &&
              run.conclusion === 'success' &&
              run.head_sha === targetSha &&
              (run.head_branch === tag || run.head_branch === `refs/tags/${tag}`) &&
              (expectedRunId === undefined || BigInt(runId) === BigInt(expectedRunId)) &&
              (expectedRunAttempt === undefined || (runAttempt !== null && BigInt(runAttempt) === BigInt(expectedRunAttempt)))
            )
          })
          assert.ok(match && match.id !== undefined, `No successful canonical .github/workflows/publish.yml push run found for tag ${tag} (${targetSha}) via ${eventName}`)
          const matchedAttempt = positiveDecimalOrNull(match.run_attempt)
          assert.ok(matchedAttempt !== null, `Matched publish run ${match.id} is missing valid run_attempt`)
          process.stdout.write(`${String(match.id)} ${matchedAttempt}`)
          EOF
          )"

          read -r PUBLISH_RUN_ID PUBLISH_RUN_ATTEMPT <<< "$PUBLISH_RUN_ID"
          export PUBLISH_RUN_ID PUBLISH_RUN_ATTEMPT
          ARTIFACTS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}/artifacts?per_page=100")"
          export ARTIFACTS_JSON
          ARTIFACT_ID="$(node --input-type=module - <<'EOF'
          import assert from 'node:assert/strict'
          const data = JSON.parse(process.env.ARTIFACTS_JSON ?? '{}')
          const list = Array.isArray(data.artifacts) ? data.artifacts : []
          const expectedName = `verified-public-package-${process.env.PUBLISH_RUN_ID ?? ''}-${process.env.PUBLISH_RUN_ATTEMPT ?? ''}`
          const matches = list.filter((a) => a && a.name === expectedName && a.expired !== true)
          assert.equal(
            matches.length,
            1,
            `Publish run ${process.env.PUBLISH_RUN_ID ?? ''} (attempt ${process.env.PUBLISH_RUN_ATTEMPT ?? ''}) must contain exactly 1 active ${expectedName} artifact`,
          )
          const artifact = matches[0]
          assert.ok(artifact.id !== undefined && /^\d+$/u.test(String(artifact.id)), `Artifact ${expectedName} is missing numeric id`)
          process.stdout.write(String(artifact.id))
          EOF
          )"

          ARTIFACT_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/lcx-finalize-art-XXXXXX")"
          trap 'rm -rf "$ARTIFACT_DIR"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${ARTIFACT_DIR}/artifact.zip"
          TAR_FILE="${ARTIFACT_DIR}/dsh-lcx-codex-${VERSION}.tgz"
          ZIP_FILE="${ARTIFACT_DIR}/artifact.zip" EXPECTED_ENTRY="dsh-lcx-codex-${VERSION}.tgz" OUT_TAR_FILE="$TAR_FILE" node --input-type=module - <<'EOF'
          import assert from 'node:assert/strict'
          import { readFileSync, statSync, writeFileSync } from 'node:fs'
          import { crc32, inflateRawSync } from 'node:zlib'

          const MAX_ARTIFACT_BYTES = 64 * 1024 * 1024
          const MAX_ZIP_BYTES = MAX_ARTIFACT_BYTES + 64 * 1024
          const zipPath = process.env.ZIP_FILE
          const zipStat = statSync(zipPath)
          assert.ok(zipStat.size >= 22, 'Downloaded artifact archive is truncated (smaller than EOCD)')
          assert.ok(zipStat.size <= MAX_ZIP_BYTES, `Downloaded artifact ZIP exceeds size limit (${zipStat.size} > ${MAX_ZIP_BYTES})`)
          const zip = readFileSync(zipPath)
          assert.ok(zip.length <= MAX_ZIP_BYTES, `Downloaded artifact ZIP exceeds size limit (${zip.length} > ${MAX_ZIP_BYTES})`)
          const expectedEntry = process.env.EXPECTED_ENTRY
          assert.ok(zip.length >= 22, 'Downloaded artifact archive is truncated (smaller than EOCD)')
          let eocdOffset = -1
          const minOffset = Math.max(0, zip.length - 0x10015)
          for (let i = zip.length - 22; i >= minOffset; i -= 1) {
            if (zip.readUInt32LE(i) === 0x06054b50) {
              const commentLen = zip.readUInt16LE(i + 20)
              if (i + 22 + commentLen === zip.length) {
                eocdOffset = i
                break
              }
            }
          }
          assert.ok(eocdOffset !== -1, 'Downloaded artifact archive is not a valid ZIP (missing EOCD)')
          const diskNumber = zip.readUInt16LE(eocdOffset + 4)
          const cdDisk = zip.readUInt16LE(eocdOffset + 6)
          const entriesOnDisk = zip.readUInt16LE(eocdOffset + 8)
          const totalEntries = zip.readUInt16LE(eocdOffset + 10)
          const cdSize = zip.readUInt32LE(eocdOffset + 12)
          const cdOffset = zip.readUInt32LE(eocdOffset + 16)
          assert.equal(diskNumber, 0, `Unsupported multi-disk ZIP (disk ${diskNumber})`)
          assert.equal(cdDisk, 0, `Unsupported multi-disk ZIP (CD disk ${cdDisk})`)
          assert.equal(entriesOnDisk, 1, `Expected 1 disk entry in downloaded artifact ZIP, got ${entriesOnDisk}`)
          assert.equal(totalEntries, 1, `Expected 1 total entry in downloaded artifact ZIP, got ${totalEntries}`)
          assert.ok(cdSize >= 46 && cdOffset + cdSize <= eocdOffset, 'Invalid ZIP central directory bounds')
          assert.equal(cdOffset + cdSize, eocdOffset, 'Unexpected trailing bytes between central directory and EOCD')
          assert.equal(zip.readUInt32LE(cdOffset), 0x02014b50, 'Invalid ZIP central directory signature')

          const cdFlags = zip.readUInt16LE(cdOffset + 8)
          const cdMethod = zip.readUInt16LE(cdOffset + 10)
          const cdCrc = zip.readUInt32LE(cdOffset + 16)
          const cdCompressedSize = zip.readUInt32LE(cdOffset + 20)
          const cdUncompressedSize = zip.readUInt32LE(cdOffset + 24)
          const cdNameLen = zip.readUInt16LE(cdOffset + 28)
          const cdExtraLen = zip.readUInt16LE(cdOffset + 30)
          const cdCommentLen = zip.readUInt16LE(cdOffset + 32)
          const cdDiskNumberStart = zip.readUInt16LE(cdOffset + 34)
          const localOffset = zip.readUInt32LE(cdOffset + 42)
          assert.equal(cdDiskNumberStart, 0, `Unsupported multi-disk ZIP entry (disk start ${cdDiskNumberStart})`)
          assert.equal(cdFlags & 0x01, 0, 'Encrypted ZIP entries are forbidden')
          assert.ok(
            cdCompressedSize !== 0xffffffff && cdUncompressedSize !== 0xffffffff && localOffset !== 0xffffffff,
            'ZIP64 sentinel sizes are not supported',
          )
          assert.equal(cdOffset + 46 + cdNameLen + cdExtraLen + cdCommentLen, cdOffset + cdSize, 'Unexpected trailing central directory bytes')
          const cdEntryName = zip.toString('utf8', cdOffset + 46, cdOffset + 46 + cdNameLen)
          assert.equal(cdEntryName, expectedEntry, `Unexpected ZIP entry ${cdEntryName} (expected ${expectedEntry})`)

          assert.ok(localOffset + 30 <= cdOffset, 'Invalid ZIP local file header offset')
          assert.equal(zip.readUInt32LE(localOffset), 0x04034b50, 'Invalid ZIP local file header signature')
          const lfhFlags = zip.readUInt16LE(localOffset + 6)
          const lfhMethod = zip.readUInt16LE(localOffset + 8)
          const lfhCrc = zip.readUInt32LE(localOffset + 14)
          const lfhCompressedSize = zip.readUInt32LE(localOffset + 18)
          const lfhUncompressedSize = zip.readUInt32LE(localOffset + 22)
          const lfhNameLen = zip.readUInt16LE(localOffset + 26)
          const lfhExtraLen = zip.readUInt16LE(localOffset + 28)
          assert.equal(lfhFlags & 0x01, 0, 'Encrypted ZIP local header is forbidden')
          assert.equal(lfhMethod, cdMethod, 'ZIP local header compression method mismatches central directory')
          const allowedFlags = cdMethod === 8 ? (0x0008 | 0x0800 | 0x0006) : (0x0008 | 0x0800)
          assert.equal(cdFlags & ~allowedFlags, 0, `Unsupported ZIP central directory flags: 0x${cdFlags.toString(16)}`)
          assert.equal(lfhFlags & ~allowedFlags, 0, `Unsupported ZIP local header flags: 0x${lfhFlags.toString(16)}`)
          assert.equal(cdFlags & 0x08, lfhFlags & 0x08, 'ZIP local header data descriptor flag mismatches central directory')
          assert.equal(cdFlags & ~0x0006, lfhFlags & ~0x0006, 'ZIP local header flags mismatch central directory')
          const hasDataDescriptor = (lfhFlags & 0x08) !== 0
          assert.ok(
            hasDataDescriptor
              ? (lfhCrc === 0 || lfhCrc === cdCrc) &&
                (lfhCompressedSize === 0 || lfhCompressedSize === cdCompressedSize) &&
                (lfhUncompressedSize === 0 || lfhUncompressedSize === cdUncompressedSize)
              : lfhCrc === cdCrc &&
                lfhCompressedSize === cdCompressedSize &&
                lfhUncompressedSize === cdUncompressedSize,
            'ZIP local header metadata mismatches central directory',
