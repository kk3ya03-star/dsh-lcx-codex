name: Cleanup legacy branches once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete chore/npm-trusted-publishing || true
          git push origin --delete codex/release-0.3.3-public || true
          git push origin --delete compat-dsh-0.1.1-rc.2 || true
