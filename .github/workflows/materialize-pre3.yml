name: Temporary materialize pre3

on:
  push:
    branches: ['release/0.4.3-pre.3']

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'ci: materialize approved pre3 source' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.3-pre.3
      - name: Import reviewed private-CI public source snapshot
        env:
          SOURCE_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-6dac-8230-ab94-95b5a9274199/raw?se=2026-09-08T19%3A30%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=ace6220a-cf07-593b-8044-6de6c6498232&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T12%3A31%3A41Z&ske=2026-09-09T12%3A31%3A41Z&sks=b&skv=2026-02-06&sig=oAoTfIGJ%2BmTzTJ6HQbyqQd3ywY%2B0Z6dY413%2B4Aox0J8%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$SOURCE_URL" -o "$RUNNER_TEMP/public-source.zip"
          mkdir "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/public-source.zip" -d "$RUNNER_TEMP/source"
          rm -rf src lib tests
          cp -a "$RUNNER_TEMP/source/src" src
          cp -a "$RUNNER_TEMP/source/lib" lib
          cp -a "$RUNNER_TEMP/source/tests" tests
          cp "$RUNNER_TEMP/source/package.json" package.json
          cp "$RUNNER_TEMP/source/package-lock.json" package-lock.json
          cp "$RUNNER_TEMP/source/cordis.patch.yml" cordis.patch.yml
          cp "$RUNNER_TEMP/source/tsconfig.json" tsconfig.json
          cp "$RUNNER_TEMP/source/tsconfig.client.json" tsconfig.client.json
          cp "$RUNNER_TEMP/source/scripts/build-client.mjs" scripts/build-client.mjs
          cp "$RUNNER_TEMP/source/scripts/probe-alpha.mjs" scripts/probe-alpha.mjs
          cp "$RUNNER_TEMP/source/scripts/validate-dsh-schema.mjs" scripts/validate-dsh-schema.mjs
          sed -i 's/0\.4\.3-pre\.2/0.4.3-pre.3/g' package.json package-lock.json
          git diff --check
      - name: Commit exact release runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src lib tests package.json package-lock.json cordis.patch.yml tsconfig.json tsconfig.client.json scripts/build-client.mjs scripts/probe-alpha.mjs scripts/validate-dsh-schema.mjs
          git commit -m 'release: import approved 0.4.3-pre.3 runtime'
          git push origin HEAD:release/0.4.3-pre.3
