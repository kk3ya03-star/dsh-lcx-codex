name: Verify public source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked build and host dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/runtime-dsh016 --ignore-scripts --no-audit --no-fund
          node scripts/link-dsh-runtime.mjs scripts/runtime-dsh016
      - name: Verify generated code, strict types, tests, schemas and package
        run: |
          node scripts/check-generated.mjs
          npm run typecheck
          npm test
          node --test scripts/release-policy.test.mjs scripts/link-dsh-runtime.test.mjs
          npm run test:schema
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
