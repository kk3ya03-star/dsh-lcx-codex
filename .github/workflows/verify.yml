name: Verify candidate source

on:
  push:
    branches: [main, 'stable/**', 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked build and host dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/runtime-dsh022 --ignore-scripts --no-audit --no-fund
          node scripts/link-dsh-runtime.mjs
      - name: Verify generated code, strict types, tests, schemas and package
        run: |
          node --test scripts/release-policy.test.mjs scripts/link-dsh-runtime.test.mjs scripts/finalize-workflow.test.mjs scripts/publish-workflow.test.mjs scripts/pack-local.test.mjs
          node scripts/check-generated.mjs
          npm run typecheck
          if [[ "${{ github.repository }}" == "kk3ya03-star/dsh-lcx-codex" ]]; then
            LCX_EXPECT_PUBLIC_CHECKOUT=1 npm test
            npm run test:schema
            git diff --exit-code
            npm run pack:local -- --public --pack-destination "$RUNNER_TEMP"
          else
            npm test
            npm run test:schema
            git diff --exit-code
            npm run pack:local -- --private --pack-destination "$RUNNER_TEMP"
          fi
